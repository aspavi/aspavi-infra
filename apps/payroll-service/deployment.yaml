apiVersion: apps/v1
kind: Deployment
metadata:
  name: payroll-service
  namespace: rrhh-system
  labels:
    app: payroll-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payroll-service
  template:
    metadata:
      labels:
        app: payroll-service
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: payroll-service
          image: ghcr.io/aspavi/aspavi-payroll-service:master-94f032b
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DB_URL
              value: "jdbc:postgresql://postgresql.rrhh-data:5432/payroll_db"
            # ASP-4: la aplicación entra como payroll_app (sin DDL, sujeta al
            # RLS) y Flyway como payroll_owner, dueño de la base. Los Secrets
            # los crea el Job db-users-job.yaml (hook PreSync).
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: payroll-db-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payroll-db-app
                  key: password
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: payroll-db-owner
                  key: username
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payroll-db-owner
                  key: password
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "validate"
            - name: SPRING_PROFILES_ACTIVE
              value: "aspavi"
            # Multitenancy — nombre alineado con ${KEYCLOAK_BASE_URL} en application-aspavi.yml
            - name: KEYCLOAK_BASE_URL
              value: "https://keycloak.aspavi.com"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: payroll-service
  namespace: rrhh-system
  labels:
    app: payroll-service
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: payroll-service
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payroll-service
  namespace: rrhh-system
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.middlewares: rrhh-system-cors-headers@kubernetescrd,rrhh-system-payroll-strip-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api.aspavi.com
      secretName: payroll-service-tls
  rules:
    - host: api.aspavi.com
      http:
        paths:
          - path: /payroll
            pathType: Prefix
            backend:
              service:
                name: payroll-service
                port:
                  number: 80
