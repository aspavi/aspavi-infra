### =====================================================================
### La cola de events-service en el bus de eventos.
###
### Vive en la carpeta del servicio y no en apps/rabbitmq/ para que ArgoCD
### sincronice la cola con el consumidor que la lee: se añaden en el mismo PR,
### y no hay ventana en la que el servicio arranque sin su cola.
###
### Los objetos sí se crean en `rrhh-data`, junto al RabbitmqCluster, porque el
### Topology Operator resuelve `rabbitmqClusterReference` en su propio
### namespace. El fichero acompaña al servicio; el objeto acompaña al clúster.
### =====================================================================
apiVersion: rabbitmq.com/v1beta1
kind: Queue
metadata:
  name: events-service-timeline
  namespace: rrhh-data
spec:
  name: events-service.timeline
  ### Quorum, aunque el clúster ya lo pone por defecto: dejarlo explícito
  ### significa que esta cola no cambia de naturaleza si algún día alguien
  ### toca el default del clúster.
  type: quorum
  durable: true
  autoDelete: false
  vhost: "/"
  arguments:
    ### Lo que no se pueda procesar sale de en medio en vez de atascar la cola.
    x-dead-letter-exchange: aspavi.events.dlx
    ### Sin límite, un mensaje envenenado en una cola quorum vuelve a la cabeza
    ### y se reintenta para siempre, bloqueando todo lo que va detrás. A los 5
    ### intentos se da por perdido y se manda al cementerio.
    x-delivery-limit: 5
  rabbitmqClusterReference:
    name: rabbitmq

---
### Donde aterriza lo que la cola de arriba no supo digerir. Sin DLX propia:
### encadenarle otra crearía un bucle de rebotes.
apiVersion: rabbitmq.com/v1beta1
kind: Queue
metadata:
  name: events-service-timeline-dlq
  namespace: rrhh-data
spec:
  name: events-service.timeline.dlq
  type: quorum
  durable: true
  autoDelete: false
  vhost: "/"
  rabbitmqClusterReference:
    name: rabbitmq

---
### Qué escucha events-service.
###
### Se ata por agregado y no con `#`. Con `#` un productor nuevo no tocaría
### infraestructura, que suena bien, pero a cambio cualquier evento publicado
### en el bus —fuese o no de línea temporal— acabaría en esta cola obligando al
### consumidor a decidir qué hacer con lo que no entiende. Así, leyendo este
### fichero se sabe exactamente qué alimenta la línea temporal, y dar de alta un
### productor es un binding en el mismo PR que lo añade.
###
### El primero es el CALENDARIO LABORAL, que es quien define los festivos: los
### festivos cuelgan de `WorkCalendar.holidays`. El convenio no define ninguno
### —no tiene dónde— y solo aporta contexto: su nombre acaba en el subtítulo
### del evento. Que el agregado lo sirva hoy collective-agreements-service es
### un detalle de a quién le tocó alojarlo, no de quién es el dueño del dato.
###
### Por eso el binding es `.work-calendar.#` y no `collective-agreements.#`:
### ese servicio también publicará cambios del convenio en sí, que no son
### línea temporal y no tienen por qué acabar en esta cola.
apiVersion: rabbitmq.com/v1beta1
kind: Binding
metadata:
  name: events-service-timeline-from-work-calendar
  namespace: rrhh-data
spec:
  vhost: "/"
  source: aspavi.events
  destination: events-service.timeline
  destinationType: queue
  routingKey: "collective-agreements.work-calendar.#"
  rabbitmqClusterReference:
    name: rabbitmq

---
### El segundo productor: organization-service publica el estado de cada
### centro de trabajo (`organization.work-center.upserted.v1` / `.deleted.v1`).
### A la línea temporal le interesa porque el centro es quien dice QUÉ
### calendario laboral aplica: los festivos son calendario × centros que lo
### usan, así que sin este binding el consumidor sabría los festivos pero no
### a qué centros proyectarlos.
apiVersion: rabbitmq.com/v1beta1
kind: Binding
metadata:
  name: events-service-timeline-from-work-center
  namespace: rrhh-data
spec:
  vhost: "/"
  source: aspavi.events
  destination: events-service.timeline
  destinationType: queue
  routingKey: "organization.work-center.#"
  rabbitmqClusterReference:
    name: rabbitmq

---
### El cementerio recoge todo lo que rebote, venga de donde venga.
apiVersion: rabbitmq.com/v1beta1
kind: Binding
metadata:
  name: events-service-timeline-dlq-catch-all
  namespace: rrhh-data
spec:
  vhost: "/"
  source: aspavi.events.dlx
  destination: events-service.timeline.dlq
  destinationType: queue
  routingKey: "#"
  rabbitmqClusterReference:
    name: rabbitmq

---
### =====================================================================
### Credenciales de events-service. En rrhh-system, junto al pod que monta el
### secreto que genera el operador.
### =====================================================================
apiVersion: rabbitmq.com/v1beta1
kind: User
metadata:
  name: events-service
  namespace: rrhh-system
spec:
  tags: []
  rabbitmqClusterReference:
    name: rabbitmq
    namespace: rrhh-data

---
### Solo leer sus dos colas. Sin `write`: este servicio consume, no publica —
### y si algún día publica, será un cambio explícito aquí y no un permiso que
### ya estaba puesto por si acaso. Sin `configure`: la topología la define este
### repo. El rebote a la DLX lo hace el broker por su cuenta, no el consumidor,
### así que no necesita permiso para escribir en ella.
apiVersion: rabbitmq.com/v1beta1
kind: Permission
metadata:
  name: events-service
  namespace: rrhh-system
spec:
  vhost: "/"
  userReference:
    name: events-service
  permissions:
    read: "^events-service\\.timeline(\\.dlq)?$"
  rabbitmqClusterReference:
    name: rabbitmq
    namespace: rrhh-data
