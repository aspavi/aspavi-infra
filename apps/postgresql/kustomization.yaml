### Lo que acompaña a la Postgres de la Helm (ArgoCD app `postgresql`, tercera
### fuente): la copia de seguridad puntual de ASP-4, lo común de los usuarios
### de base de datos por servicio y la limpieza de app_user. Ver README.md.
###
### Sin `namespace:` global: el Role y el RoleBinding de db-users-rbac.yaml
### van en rrhh-system, y cada objeto ya declara el suyo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - backup-pvc.yaml
  - backup-job-20261112.yaml
  - backup-job-20261113.yaml
  - db-users-rbac.yaml
  - app-user-cleanup-job.yaml
  - legacy-roles-lockdown-job.yaml
  - asp4-fase2-precheck-job.yaml
  - asp4-employee-diag-job.yaml
  # copias diarias por tenant al bucket (ASP-43)
  - tenant-backup/backup-reader-rbac.yaml
  - tenant-backup/backup-reader-job.yaml
  - tenant-backup/cronjob.yaml
configMapGenerator:
  - name: postgresql-backup-script
    namespace: rrhh-data
    files:
      - backup.sh
  # los dos pasos del Job de usuarios de cada servicio (apps/<svc>/db-users-job.yaml)
  - name: postgresql-db-users-scripts
    namespace: rrhh-data
    files:
      - db-users-secrets.sh
      - db-users.sh
  # limpieza final de app_user (ASP-4 fase 1, paso 4)
  - name: postgresql-app-user-cleanup-script
    namespace: rrhh-data
    files:
      - app-user-cleanup.sh
  # los roles sueltos que no son de ningún servicio (ASP-4)
  - name: postgresql-legacy-roles-lockdown-script
    namespace: rrhh-data
    files:
      - legacy-roles-lockdown.sh
  # comprobación previa de ASP-4 fase 2, solo lectura
  - name: postgresql-asp4-fase2-precheck-script
    namespace: rrhh-data
    files:
      - asp4-fase2-precheck.sh
  # diagnóstico de employee_db tras el fallo de V20, solo lectura
  - name: postgresql-asp4-employee-diag-script
    namespace: rrhh-data
    files:
      - asp4-employee-diag.sh
  # copias por tenant (ASP-43): scripts, qué tenants y dónde
  - name: postgresql-tenant-backup-scripts
    namespace: rrhh-data
    files:
      - tenant-backup/backup-reader-secret.sh
      - tenant-backup/backup-reader.sh
      - tenant-backup/fetch-age.sh
      - tenant-backup/dump.sh
      - tenant-backup/restore-check.sh
      - tenant-backup/kc-export.sh
      - tenant-backup/upload.py
  - name: postgresql-tenant-backup-config
    namespace: rrhh-data
    files:
      - tenant-backup/tenants.conf
  - name: postgresql-tenant-backup-settings
    namespace: rrhh-data
    envs:
      - tenant-backup/settings.conf
generatorOptions:
  # Nombres fijos: los Jobs de los servicios (en otras apps) los referencian
  # por nombre, y el de la copia es de un solo uso.
  disableNameSuffixHash: true
