### Rol backup_reader de Postgres (ASP-43): con él leen las copias por tenant.
### Hook Sync de la app `postgresql`: corre en cada sync de la app, es
### idempotente, y así una base de servicio nueva recibe su CONNECT. Corre en
### rrhh-data porque allí está el superusuario. Ver README.md, "Copias por tenant".
###   1. initContainer `secret`: crea, si falta, el Secret postgresql-backup-reader
###      y deja la contraseña en memoria
###   2. `postgres`: el rol, pg_read_all_data, CONNECT en las *_db y comprobación
###      (backup-reader.sh)
apiVersion: batch/v1
kind: Job
metadata:
  name: postgresql-backup-reader
  namespace: rrhh-data
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: postgresql-backup-reader
    spec:
      restartPolicy: Never
      serviceAccountName: postgresql-backup-reader
      securityContext:
        runAsUser: 70 # postgres en la imagen alpine
        runAsGroup: 70
        runAsNonRoot: true
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: secret
          image: alpine/k8s:1.34.1
          # si falla, las últimas líneas del log quedan en el estado del pod
          terminationMessagePolicy: FallbackToLogsOnError
          command: ["sh", "/script/backup-reader-secret.sh"]
          env:
            - name: HOME # caché de kubectl
              value: /tmp
          securityContext: &hardened
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts: &mounts
            - name: creds
              mountPath: /creds
            - name: tmp
              mountPath: /tmp
            - name: script
              mountPath: /script
              readOnly: true
      containers:
        - name: postgres
          image: postgres:18.3-alpine
          terminationMessagePolicy: FallbackToLogsOnError
          command: ["sh", "/script/backup-reader.sh"]
          env:
            - name: PGHOST
              value: postgresql.rrhh-data.svc.cluster.local
            - name: PGUSER
              value: postgres
            - name: PGDATABASE
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-helm-secrets
                  key: postgres-password
          securityContext: *hardened
          volumeMounts: *mounts
      volumes:
        # la contraseña, solo en memoria y solo mientras vive el pod
        - name: creds
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: tmp
          emptyDir: {}
        - name: script
          configMap:
            name: postgresql-tenant-backup-scripts
