# Copias por tenant (ASP-43): dónde y con qué retención por defecto. Formato
# de fichero de entorno (CLAVE=valor), ConfigMap postgresql-tenant-backup-settings.
# Ver apps/postgresql/README.md, "Copias por tenant". Nada secreto: las claves
# van en el Secret postgresql-tenant-backup.
#
# S3_ENDPOINT: https://<ubicación>.your-objectstorage.com (fsn1, nbg1 o hel1);
# S3_REGION: la misma ubicación.
S3_BUCKET=
S3_ENDPOINT=
S3_REGION=
S3_PREFIX=backups
KEEP_DAILY=7
KEEP_WEEKLY=4
KEEP_MONTHLY=6
