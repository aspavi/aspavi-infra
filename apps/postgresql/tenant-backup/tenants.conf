# Copias por tenant (ASP-43): qué tenants tienen copia diaria en el bucket.
# Ver apps/postgresql/README.md, "Copias por tenant".
#
#   <tenant>  on|off  [diarias/semanales/mensuales]
#
# - on: copia cada noche; off: ninguna.
# - Un tenant con realm rrhh-tenant-<id> que NO esté aquí también tiene copia
#   (el valor por defecto es on) y el log del CronJob lo avisa: añádelo.
# - La retención, si no se pone, es la de settings.conf (7/4/6).
# - Activar o desactivar un tenant es cambiar esta línea en una PR: el
#   CronJob lee el fichero en cada ejecución; ningún servicio se toca.
acme   on
test   off   # entorno de pruebas
demo   off   # solo la prueba de alta de ASP-21
