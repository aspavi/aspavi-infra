apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-docs
  namespace: rrhh-docs
  labels:
    app: api-docs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-docs
  template:
    metadata:
      labels:
        app: api-docs
    spec:
      containers:
        - name: api-docs
          image: swaggerapi/swagger-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: URLS
              valueFrom:
                configMapKeyRef:
                  name: api-docs-config
                  key: urls
            - name: BASE_URL
              value: "/"
            - name: SWAGGER_JSON_URL
              value: ""
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          volumeMounts:
            - name: specs
              mountPath: /usr/share/nginx/html/specs
              readOnly: true
      volumes:
        - name: specs
          projected:
            sources:
              - configMap:
                  name: api-docs-spec-absence-service
              - configMap:
                  name: api-docs-spec-attendance-service
              - configMap:
                  name: api-docs-spec-collective-agreements-service
              - configMap:
                  name: api-docs-spec-contract-service
              - configMap:
                  name: api-docs-spec-employee-service
              - configMap:
                  name: api-docs-spec-events-service
              # Legado: solo los servicios cuyo pipeline aún no publica su
              # ConfigMap api-docs-spec-<servicio>. El filtro items evita
              # colisiones de rutas (el kubelet rechaza duplicados en projected).
              - configMap:
                  name: api-docs-specs
                  items:
                    - key: audit-service.json
                      path: audit-service.json
                    - key: organization-service.json
                      path: organization-service.json
                    - key: payroll-service.json
                      path: payroll-service.json
---
apiVersion: v1
kind: Service
metadata:
  name: api-docs
  namespace: rrhh-docs
  labels:
    app: api-docs
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: api-docs
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-docs
  namespace: rrhh-docs
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - docs.api.aspavi.com
      secretName: api-docs-tls
  rules:
    - host: docs.api.aspavi.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-docs
                port:
                  number: 80
