    \ an ARCHIVED calendar, unarchive it first.\",\n        \"operationId\": \"update\"\
    ,\n        \"parameters\": [\n          {\n            \"name\": \"id\",\n   \
    \         \"in\": \"path\",\n            \"required\": true,\n            \"schema\"\
    : {\n              \"type\": \"string\",\n              \"format\": \"uuid\"\n\
    \            }\n          }\n        ],\n        \"requestBody\": {\n        \
    \  \"content\": {\n            \"application/json\": {\n              \"schema\"\
    : {\n                \"$ref\": \"#/components/schemas/WorkCalendarRequest\"\n\
    \              }\n            }\n          },\n          \"required\": true\n\
    \        },\n        \"responses\": {\n          \"400\": {\n            \"description\"\
    : \"Validation error\",\n            \"content\": {\n              \"*/*\": {\n\
    \                \"schema\": {\n                  \"$ref\": \"#/components/schemas/WorkCalendarResponse\"\
    \n                }\n              }\n            }\n          },\n          \"\
    404\": {\n            \"description\": \"Calendar or locality not found\",\n \
    \           \"content\": {\n              \"*/*\": {\n                \"schema\"\
    : {\n                  \"$ref\": \"#/components/schemas/WorkCalendarResponse\"\
    \n                }\n              }\n            }\n          },\n          \"\
    200\": {\n            \"description\": \"Updated\",\n            \"content\":\
    \ {\n              \"*/*\": {\n                \"schema\": {\n               \
    \   \"$ref\": \"#/components/schemas/WorkCalendarResponse\"\n                }\n\
    \              }\n            }\n          },\n          \"409\": {\n        \
    \    \"description\": \"Calendar is archived\",\n            \"content\": {\n\
    \              \"*/*\": {\n                \"schema\": {\n                  \"\
    $ref\": \"#/components/schemas/WorkCalendarResponse\"\n                }\n   \
    \           }\n            }\n          }\n        },\n        \"security\": [\n\
    \          {\n            \"bearerAuth\": []\n          }\n        ]\n      },\n\
    \      \"delete\": {\n        \"tags\": [\n          \"Work Calendars\"\n    \
    \    ],\n        \"summary\": \"Delete a work calendar (cascades to its holidays)\"\
    ,\n        \"operationId\": \"delete\",\n        \"parameters\": [\n         \
    \ {\n            \"name\": \"id\",\n            \"in\": \"path\",\n          \
    \  \"required\": true,\n            \"schema\": {\n              \"type\": \"\
