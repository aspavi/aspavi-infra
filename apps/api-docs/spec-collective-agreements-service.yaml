    \    \"name\": \"Aspavi\",\n      \"url\": \"https://aspavi.com\",\n      \"email\"\
    : \"contact@aspavi.com\"\n    },\n    \"license\": {\n      \"name\": \"Apache\
    \ 2.0\",\n      \"url\": \"https://www.apache.org/licenses/LICENSE-2.0.html\"\n\
    \    },\n    \"version\": \"1.0.0\"\n  },\n  \"servers\": [\n    {\n      \"url\"\
    : \"https://api.aspavi.com/collective-agreements\"\n    }\n  ],\n  \"tags\": [\n\
    \    {\n      \"name\": \"Work Calendars\",\n      \"description\": \"Annual work\
