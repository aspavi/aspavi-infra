    \          \"$ref\": \"#/components/schemas/HolidayRequest\"\n              }\n\
    \            }\n          },\n          \"required\": true\n        },\n     \
    \   \"responses\": {\n          \"200\": {\n            \"description\": \"OK\"\
    ,\n            \"content\": {\n              \"*/*\": {\n                \"schema\"\
    : {\n                  \"$ref\": \"#/components/schemas/HolidayResponse\"\n  \
    \              }\n              }\n            }\n          }\n        },\n  \
    \      \"security\": [\n          {\n            \"bearerAuth\": []\n        \
    \  }\n        ]\n      },\n      \"delete\": {\n        \"tags\": [\n        \
