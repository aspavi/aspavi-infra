    \     }\n        ],\n        \"responses\": {\n          \"200\": {\n        \
    \    \"description\": \"OK\"\n          }\n        },\n        \"security\": [\n\
    \          {\n            \"bearerAuth\": []\n          }\n        ]\n      }\n\
    \    },\n    \"/api/v1/work-calendars\": {\n      \"get\": {\n        \"tags\"\
