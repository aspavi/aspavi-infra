    \      ],\n        \"responses\": {\n          \"200\": {\n            \"description\"\
    : \"OK\"\n          }\n        },\n        \"security\": [\n          {\n    \
    \        \"bearerAuth\": []\n          }\n        ]\n      }\n    },\n    \"/api/v1/work-calendars/{id}/jornada-adjustment\"\
    : {\n      \"put\": {\n        \"tags\": [\n          \"Work Calendars\"\n   \
    \     ],\n        \"summary\": \"Set (or replace) the jornada adjustment for a\
    \ work calendar\",\n        \"description\": \"Creates the adjustment row on first\
    \ call; overwrites on subsequent calls. adjustmentDays is a signed fractional\
    \ delta vs. the convenio base. effectiveHms is the resulting daily time in HH:MM:SS.\"\
    ,\n        \"operationId\": \"setAdjustment\",\n        \"parameters\": [\n  \
    \        {\n            \"name\": \"id\",\n            \"in\": \"path\",\n   \
    \         \"required\": true,\n            \"schema\": {\n              \"type\"\
    : \"string\",\n              \"format\": \"uuid\"\n            }\n          }\n\
    \        ],\n        \"requestBody\": {\n          \"content\": {\n          \
    \  \"application/json\": {\n              \"schema\": {\n                \"$ref\"\
    : \"#/components/schemas/WorkCalendarAdjustmentDto\"\n              }\n      \
    \      }\n          },\n          \"required\": true\n        },\n        \"responses\"\
    : {\n          \"400\": {\n            \"description\": \"Validation error\",\n\
    \            \"content\": {\n              \"*/*\": {\n                \"schema\"\
    : {\n                  \"$ref\": \"#/components/schemas/WorkCalendarAdjustmentDto\"\
    \n                }\n              }\n            }\n          },\n          \"\
