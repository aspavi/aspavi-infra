    \ \"name\": \"pageable\",\n            \"in\": \"query\",\n            \"required\"\
    : true,\n            \"schema\": {\n              \"$ref\": \"#/components/schemas/Pageable\"\
    \n            }\n          }\n        ],\n        \"responses\": {\n         \
    \ \"200\": {\n            \"description\": \"OK\",\n            \"content\": {\n\
    \              \"*/*\": {\n                \"schema\": {\n                  \"\
