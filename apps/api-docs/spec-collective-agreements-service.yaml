    parameters\": [\n          {\n            \"name\": \"id\",\n            \"in\"\
    : \"path\",\n            \"required\": true,\n            \"schema\": {\n    \
    \          \"type\": \"string\",\n              \"format\": \"uuid\"\n       \
    \     }\n          }\n        ],\n        \"responses\": {\n          \"204\"\
    : {\n            \"description\": \"Adjustment removed\"\n          },\n     \
    \     \"404\": {\n            \"description\": \"Calendar not found\"\n      \
    \    }\n        },\n        \"security\": [\n          {\n            \"bearerAuth\"\
    : []\n          }\n        ]\n      }\n    },\n    \"/api/v1/work-calendars/{calendarId}/holidays/{holidayId}\"\
