    \   {\n            \"name\": \"calendarId\",\n            \"in\": \"path\",\n\
    \            \"required\": true,\n            \"schema\": {\n              \"\
    type\": \"string\",\n              \"format\": \"uuid\"\n            }\n     \
    \     },\n          {\n            \"name\": \"holidayId\",\n            \"in\"\
    : \"path\",\n            \"required\": true,\n            \"schema\": {\n    \
    \          \"type\": \"string\",\n              \"format\": \"uuid\"\n       \
    \     }\n          }\n        ],\n        \"requestBody\": {\n          \"content\"\
