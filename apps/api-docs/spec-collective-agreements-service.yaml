    : [\n          {\n            \"name\": \"calendarId\",\n            \"in\": \"\
    path\",\n            \"required\": true,\n            \"schema\": {\n        \
    \      \"type\": \"string\",\n              \"format\": \"uuid\"\n           \
    \ }\n          },\n          {\n            \"name\": \"holidayId\",\n       \
    \     \"in\": \"path\",\n            \"required\": true,\n            \"schema\"\
    : {\n              \"type\": \"string\",\n              \"format\": \"uuid\"\n\
    \            }\n          }\n        ],\n        \"responses\": {\n          \"\
    200\": {\n            \"description\": \"OK\"\n          }\n        },\n     \
    \   \"security\": [\n          {\n            \"bearerAuth\": []\n          }\n\
