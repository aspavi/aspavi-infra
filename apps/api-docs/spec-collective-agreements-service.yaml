    : {\n              \"*/*\": {\n                \"schema\": {\n               \
    \   \"$ref\": \"#/components/schemas/WorkCalendarAdjustmentDto\"\n           \
    \     }\n              }\n            }\n          }\n        },\n        \"security\"\
    : [\n          {\n            \"bearerAuth\": []\n          }\n        ]\n   \
    \   },\n      \"delete\": {\n        \"tags\": [\n          \"Work Calendars\"\
    \n        ],\n        \"summary\": \"Remove the jornada adjustment (revert to\
