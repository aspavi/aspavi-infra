    : {\n      \"get\": {\n        \"tags\": [\n          \"Work Calendars\"\n   \
    \     ],\n        \"summary\": \"Get a work calendar by ID\",\n        \"operationId\"\
    : \"getById\",\n        \"parameters\": [\n          {\n            \"name\":\
    \ \"id\",\n            \"in\": \"path\",\n            \"required\": true,\n  \
    \          \"schema\": {\n              \"type\": \"string\",\n              \"\
    format\": \"uuid\"\n            }\n          }\n        ],\n        \"responses\"\
    : {\n          \"200\": {\n            \"description\": \"Calendar found\",\n\
    \            \"content\": {\n              \"*/*\": {\n                \"schema\"\
    : {\n                  \"$ref\": \"#/components/schemas/WorkCalendarResponse\"\
    \n                }\n              }\n            }\n          },\n          \"\
    404\": {\n            \"description\": \"Calendar not found\",\n            \"\
    content\": {\n              \"*/*\": {\n                \"schema\": {\n      \
    \            \"$ref\": \"#/components/schemas/WorkCalendarResponse\"\n       \
    \         }\n              }\n            }\n          }\n        },\n       \
    \ \"security\": [\n          {\n            \"bearerAuth\": []\n          }\n\
    \        ]\n      },\n      \"put\": {\n        \"tags\": [\n          \"Work\
