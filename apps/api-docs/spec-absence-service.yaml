    ,\n            \"in\": \"path\",\n            \"required\": true,\n          \
    \  \"schema\": {\n              \"type\": \"string\",\n              \"format\"\
    : \"uuid\"\n            }\n          }\n        ],\n        \"requestBody\": {\n\
    \          \"content\": {\n            \"application/json\": {\n             \
