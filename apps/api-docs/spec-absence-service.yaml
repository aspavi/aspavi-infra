    \ {\n            \"name\": \"id\",\n            \"in\": \"path\",\n          \
    \  \"required\": true,\n            \"schema\": {\n              \"type\": \"\
    string\",\n              \"format\": \"uuid\"\n            }\n          }\n  \
    \      ],\n        \"responses\": {\n          \"409\": {\n            \"description\"\
    : \"Type has requests \\u2014 deactivate instead\"\n          },\n          \"\
    204\": {\n            \"description\": \"Deleted\"\n          },\n          \"\
    404\": {\n            \"description\": \"Not found in this tenant\"\n        \
    \  }\n        },\n        \"security\": [\n          {\n            \"bearerAuth\"\
    : []\n          }\n        ]\n      }\n    },\n    \"/api/v1/absence-requests/{id}\"\
    : {\n      \"get\": {\n        \"tags\": [\n          \"Absence requests\"\n \
    \       ],\n        \"summary\": \"Get a request\",\n        \"operationId\":\
    \ \"get_1\",\n        \"parameters\": [\n          {\n            \"name\": \"\
    id\",\n            \"in\": \"path\",\n            \"required\": true,\n      \
    \      \"schema\": {\n              \"type\": \"string\",\n              \"format\"\
    : \"uuid\"\n            }\n          }\n        ],\n        \"responses\": {\n\
    \          \"404\": {\n            \"description\": \"Not found in this tenant\"\
    ,\n            \"content\": {\n              \"*/*\": {\n                \"schema\"\
    : {\n                  \"$ref\": \"#/components/schemas/AbsenceRequestResponse\"\
    \n                }\n              }\n            }\n          },\n          \"\
    200\": {\n            \"description\": \"Found\",\n            \"content\": {\n\
    \              \"*/*\": {\n                \"schema\": {\n                  \"\
    $ref\": \"#/components/schemas/AbsenceRequestResponse\"\n                }\n \
    \             }\n            }\n          }\n        },\n        \"security\"\
    : [\n          {\n            \"bearerAuth\": []\n          }\n        ]\n   \
    \   },\n      \"put\": {\n        \"tags\": [\n          \"Absence requests\"\n\
    \        ],\n        \"summary\": \"Update a pending request\",\n        \"operationId\"\
