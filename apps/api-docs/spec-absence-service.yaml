    \ {\n              \"*/*\": {\n                \"schema\": {\n               \
    \   \"$ref\": \"#/components/schemas/AbsenceRequestResponse\"\n              \
    \  }\n              }\n            }\n          },\n          \"400\": {\n   \
    \         \"description\": \"Invalid range or yearly cap exceeded\",\n       \
    \     \"content\": {\n              \"*/*\": {\n                \"schema\": {\n\
    \                  \"$ref\": \"#/components/schemas/AbsenceRequestResponse\"\n\
    \                }\n              }\n            }\n          },\n          \"\
    200\": {\n            \"description\": \"Updated\",\n            \"content\":\
    \ {\n              \"*/*\": {\n                \"schema\": {\n               \
    \   \"$ref\": \"#/components/schemas/AbsenceRequestResponse\"\n              \
    \  }\n              }\n            }\n          },\n          \"404\": {\n   \
    \         \"description\": \"Not found in this tenant\",\n            \"content\"\
    : {\n              \"*/*\": {\n                \"schema\": {\n               \
    \   \"$ref\": \"#/components/schemas/AbsenceRequestResponse\"\n              \
    \  }\n              }\n            }\n          }\n        },\n        \"security\"\
    : [\n          {\n            \"bearerAuth\": []\n          }\n        ]\n   \
    \   },\n      \"delete\": {\n        \"tags\": [\n          \"Absence requests\"\
    \n        ],\n        \"summary\": \"Delete a request\",\n        \"operationId\"\
    : \"delete_1\",\n        \"parameters\": [\n          {\n            \"name\"\
    : \"id\",\n            \"in\": \"path\",\n            \"required\": true,\n  \
    \          \"schema\": {\n              \"type\": \"string\",\n              \"\
    format\": \"uuid\"\n            }\n          }\n        ],\n        \"responses\"\
    : {\n          \"204\": {\n            \"description\": \"Deleted\"\n        \
    \  },\n          \"404\": {\n            \"description\": \"Not found in this\
    \ tenant\"\n          }\n        },\n        \"security\": [\n          {\n  \
    \          \"bearerAuth\": []\n          }\n        ]\n      }\n    },\n    \"\
    /api/v1/absence-types\": {\n      \"get\": {\n        \"tags\": [\n          \"\
    Absence types\"\n        ],\n        \"summary\": \"List absence types\",\n  \
    \      \"operationId\": \"list_1\",\n        \"parameters\": [\n          {\n\
    \            \"name\": \"activeOnly\",\n            \"in\": \"query\",\n     \
    \       \"required\": false,\n            \"schema\": {\n              \"type\"\
    : \"boolean\"\n            }\n          }\n        ],\n        \"responses\":\
    \ {\n          \"200\": {\n            \"description\": \"OK\",\n            \"\
    content\": {\n              \"*/*\": {\n                \"schema\": {\n      \
    \            \"type\": \"array\",\n                  \"items\": {\n          \
    \          \"$ref\": \"#/components/schemas/AbsenceTypeResponse\"\n          \
    \        }\n                }\n              }\n            }\n          }\n \
    \       },\n        \"security\": [\n          {\n            \"bearerAuth\":\
    \ []\n          }\n        ]\n      },\n      \"post\": {\n        \"tags\": [\n\
    \          \"Absence types\"\n        ],\n        \"summary\": \"Create an absence\
    \ type\",\n        \"operationId\": \"create\",\n        \"requestBody\": {\n\
    \          \"content\": {\n            \"application/json\": {\n             \
    \ \"schema\": {\n                \"$ref\": \"#/components/schemas/AbsenceTypeRequest\"\
    \n              }\n            }\n          },\n          \"required\": true\n\
    \        },\n        \"responses\": {\n          \"201\": {\n            \"description\"\
    : \"Created\",\n            \"content\": {\n              \"*/*\": {\n       \
    \         \"schema\": {\n                  \"$ref\": \"#/components/schemas/AbsenceTypeResponse\"\
    \n                }\n              }\n            }\n          },\n          \"\
    409\": {\n            \"description\": \"Code already used in this tenant\",\n\
    \            \"content\": {\n              \"*/*\": {\n                \"schema\"\
    : {\n                  \"$ref\": \"#/components/schemas/AbsenceTypeResponse\"\n\
    \                }\n              }\n            }\n          }\n        },\n\
    \        \"security\": [\n          {\n            \"bearerAuth\": []\n      \
    \    }\n        ]\n      }\n    },\n    \"/api/v1/absence-requests\": {\n    \
    \  \"get\": {\n        \"tags\": [\n          \"Absence requests\"\n        ],\n\
    \        \"summary\": \"List requests, optionally filtered by employee and status\"\
    ,\n        \"operationId\": \"list_2\",\n        \"parameters\": [\n         \
    \ {\n            \"name\": \"employeeId\",\n            \"in\": \"query\",\n \
    \           \"required\": false,\n            \"schema\": {\n              \"\
    type\": \"string\",\n              \"format\": \"uuid\"\n            }\n     \
    \     },\n          {\n            \"name\": \"status\",\n            \"in\":\
    \ \"query\",\n            \"required\": false,\n            \"schema\": {\n  \
    \            \"type\": \"string\",\n              \"enum\": [\n              \
    \  \"PENDING\",\n                \"APPROVED\",\n                \"REJECTED\",\n\
    \                \"CANCELLED\"\n              ]\n            }\n          }\n\
    \        ],\n        \"responses\": {\n          \"200\": {\n            \"description\"\
    : \"OK\",\n            \"content\": {\n              \"*/*\": {\n            \
    \    \"schema\": {\n                  \"type\": \"array\",\n                 \
    \ \"items\": {\n                    \"$ref\": \"#/components/schemas/AbsenceRequestResponse\"\
    \n                  }\n                }\n              }\n            }\n   \
    \       }\n        },\n        \"security\": [\n          {\n            \"bearerAuth\"\
    : []\n          }\n        ]\n      },\n      \"post\": {\n        \"tags\": [\n\
    \          \"Absence requests\"\n        ],\n        \"summary\": \"Create a request.\
    \ Types that need no approval are born approved\",\n        \"operationId\": \"\
    create_1\",\n        \"requestBody\": {\n          \"content\": {\n          \
    \  \"application/json\": {\n              \"schema\": {\n                \"$ref\"\
    : \"#/components/schemas/AbsenceRequestRequest\"\n              }\n          \
    \  }\n          },\n          \"required\": true\n        },\n        \"responses\"\
    : {\n          \"404\": {\n            \"description\": \"Absence type not found\
    \ in this tenant\",\n            \"content\": {\n              \"*/*\": {\n  \
    \              \"schema\": {\n                  \"$ref\": \"#/components/schemas/AbsenceRequestResponse\"\
    \n                }\n              }\n            }\n          },\n          \"\
    400\": {\n            \"description\": \"Invalid range or yearly cap exceeded\"\
    ,\n            \"content\": {\n              \"*/*\": {\n                \"schema\"\
    : {\n                  \"$ref\": \"#/components/schemas/AbsenceRequestResponse\"\
    \n                }\n              }\n            }\n          },\n          \"\
    201\": {\n            \"description\": \"Created\",\n            \"content\":\
    \ {\n              \"*/*\": {\n                \"schema\": {\n               \
    \   \"$ref\": \"#/components/schemas/AbsenceRequestResponse\"\n              \
    \  }\n              }\n            }\n          },\n          \"409\": {\n   \
    \         \"description\": \"Overlaps another absence of the same employee\",\n\
    \            \"content\": {\n              \"*/*\": {\n                \"schema\"\
    : {\n                  \"$ref\": \"#/components/schemas/AbsenceRequestResponse\"\
    \n                }\n              }\n            }\n          }\n        },\n\
    \        \"security\": [\n          {\n            \"bearerAuth\": []\n      \
    \    }\n        ]\n      }\n    },\n    \"/api/v1/absence-requests/{id}/reject\"\
    : {\n      \"post\": {\n        \"tags\": [\n          \"Absence requests\"\n\
    \        ],\n        \"summary\": \"Reject a pending request\",\n        \"operationId\"\
    : \"reject\",\n        \"parameters\": [\n          {\n            \"name\": \"\
    id\",\n            \"in\": \"path\",\n            \"required\": true,\n      \
    \      \"schema\": {\n              \"type\": \"string\",\n              \"format\"\
    : \"uuid\"\n            }\n          }\n        ],\n        \"requestBody\": {\n\
    \          \"content\": {\n            \"application/json\": {\n             \
    \ \"schema\": {\n                \"$ref\": \"#/components/schemas/AbsenceDecisionRequest\"\
    \n              }\n            }\n          },\n          \"required\": true\n\
    \        },\n        \"responses\": {\n          \"409\": {\n            \"description\"\
    : \"Already decided\",\n            \"content\": {\n              \"*/*\": {\n\
    \                \"schema\": {\n                  \"$ref\": \"#/components/schemas/AbsenceRequestResponse\"\
    \n                }\n              }\n            }\n          },\n          \"\
    200\": {\n            \"description\": \"Rejected\",\n            \"content\"\
    : {\n              \"*/*\": {\n                \"schema\": {\n               \
    \   \"$ref\": \"#/components/schemas/AbsenceRequestResponse\"\n              \
    \  }\n              }\n            }\n          },\n          \"404\": {\n   \
    \         \"description\": \"Not found in this tenant\",\n            \"content\"\
    : {\n              \"*/*\": {\n                \"schema\": {\n               \
    \   \"$ref\": \"#/components/schemas/AbsenceRequestResponse\"\n              \
    \  }\n              }\n            }\n          }\n        },\n        \"security\"\
    : [\n          {\n            \"bearerAuth\": []\n          }\n        ]\n   \
    \   }\n    },\n    \"/api/v1/absence-requests/{id}/cancel\": {\n      \"post\"\
    : {\n        \"tags\": [\n          \"Absence requests\"\n        ],\n       \
    \ \"summary\": \"Cancel a request that has not started yet\",\n        \"operationId\"\
    : \"cancel\",\n        \"parameters\": [\n          {\n            \"name\": \"\
    id\",\n            \"in\": \"path\",\n            \"required\": true,\n      \
    \      \"schema\": {\n              \"type\": \"string\",\n              \"format\"\
    : \"uuid\"\n            }\n          }\n        ],\n        \"responses\": {\n\
    \          \"200\": {\n            \"description\": \"Cancelled\",\n         \
    \   \"content\": {\n              \"*/*\": {\n                \"schema\": {\n\
    \                  \"$ref\": \"#/components/schemas/AbsenceRequestResponse\"\n\
    \                }\n              }\n            }\n          },\n          \"\
    404\": {\n            \"description\": \"Not found in this tenant\",\n       \
    \     \"content\": {\n              \"*/*\": {\n                \"schema\": {\n\
    \                  \"$ref\": \"#/components/schemas/AbsenceRequestResponse\"\n\
    \                }\n              }\n            }\n          },\n          \"\
    409\": {\n            \"description\": \"Already closed, or the absence has started\"\
    ,\n            \"content\": {\n              \"*/*\": {\n                \"schema\"\
    : {\n                  \"$ref\": \"#/components/schemas/AbsenceRequestResponse\"\
    \n                }\n              }\n            }\n          }\n        },\n\
    \        \"security\": [\n          {\n            \"bearerAuth\": []\n      \
    \    }\n        ]\n      }\n    },\n    \"/api/v1/absence-requests/{id}/approve\"\
    : {\n      \"post\": {\n        \"tags\": [\n          \"Absence requests\"\n\
    \        ],\n        \"summary\": \"Approve a pending request\",\n        \"operationId\"\
    : \"approve\",\n        \"parameters\": [\n          {\n            \"name\":\
    \ \"id\",\n            \"in\": \"path\",\n            \"required\": true,\n  \
    \          \"schema\": {\n              \"type\": \"string\",\n              \"\
    format\": \"uuid\"\n            }\n          }\n        ],\n        \"requestBody\"\
    : {\n          \"content\": {\n            \"application/json\": {\n         \
    \     \"schema\": {\n                \"$ref\": \"#/components/schemas/AbsenceDecisionRequest\"\
    \n              }\n            }\n          },\n          \"required\": true\n\
    \        },\n        \"responses\": {\n          \"200\": {\n            \"description\"\
    : \"Approved\",\n            \"content\": {\n              \"*/*\": {\n      \
    \          \"schema\": {\n                  \"$ref\": \"#/components/schemas/AbsenceRequestResponse\"\
    \n                }\n              }\n            }\n          },\n          \"\
    409\": {\n            \"description\": \"Already decided, or now overlaps another\
    \ absence\",\n            \"content\": {\n              \"*/*\": {\n         \
    \       \"schema\": {\n                  \"$ref\": \"#/components/schemas/AbsenceRequestResponse\"\
    \n                }\n              }\n            }\n          },\n          \"\
    404\": {\n            \"description\": \"Not found in this tenant\",\n       \
    \     \"content\": {\n              \"*/*\": {\n                \"schema\": {\n\
    \                  \"$ref\": \"#/components/schemas/AbsenceRequestResponse\"\n\
    \                }\n              }\n            }\n          }\n        },\n\
    \        \"security\": [\n          {\n            \"bearerAuth\": []\n      \
    \    }\n        ]\n      }\n    },\n    \"/api/v1/vacation-balances/{employeeId}\"\
    : {\n      \"get\": {\n        \"tags\": [\n          \"Vacation balances\"\n\
    \        ],\n        \"summary\": \"Balance of one employee. Returns zeros when\
    \ nothing has been granted yet\",\n        \"operationId\": \"get_2\",\n     \
    \   \"parameters\": [\n          {\n            \"name\": \"employeeId\",\n  \
    \          \"in\": \"path\",\n            \"required\": true,\n            \"\
    schema\": {\n              \"type\": \"string\",\n              \"format\": \"\
    uuid\"\n            }\n          },\n          {\n            \"name\": \"year\"\
    ,\n            \"in\": \"query\",\n            \"required\": false,\n        \
    \    \"schema\": {\n              \"type\": \"integer\",\n              \"format\"\
    : \"int32\"\n            }\n          }\n        ],\n        \"responses\": {\n\
    \          \"200\": {\n            \"description\": \"OK\",\n            \"content\"\
    : {\n              \"*/*\": {\n                \"schema\": {\n               \
    \   \"$ref\": \"#/components/schemas/VacationBalanceResponse\"\n             \
    \   }\n              }\n            }\n          }\n        },\n        \"security\"\
    : [\n          {\n            \"bearerAuth\": []\n          }\n        ]\n   \
    \   }\n    },\n    \"/api/v1/absence-requests/overlapping\": {\n      \"get\"\
    : {\n        \"tags\": [\n          \"Absence requests\"\n        ],\n       \
    \ \"summary\": \"Requests overlapping a date range \\u2014 who is away, and when\"\
    ,\n        \"operationId\": \"overlapping\",\n        \"parameters\": [\n    \
    \      {\n            \"name\": \"from\",\n            \"in\": \"query\",\n  \
    \          \"required\": true,\n            \"schema\": {\n              \"type\"\
    : \"string\",\n              \"format\": \"date\"\n            }\n          },\n\
    \          {\n            \"name\": \"to\",\n            \"in\": \"query\",\n\
    \            \"required\": true,\n            \"schema\": {\n              \"\
    type\": \"string\",\n              \"format\": \"date\"\n            }\n     \
    \     }\n        ],\n        \"responses\": {\n          \"200\": {\n        \
    \    \"description\": \"OK\",\n            \"content\": {\n              \"*/*\"\
    : {\n                \"schema\": {\n                  \"type\": \"array\",\n \
    \                 \"items\": {\n                    \"$ref\": \"#/components/schemas/AbsenceRequestResponse\"\
    \n                  }\n                }\n              }\n            }\n   \
    \       }\n        },\n        \"security\": [\n          {\n            \"bearerAuth\"\
    : []\n          }\n        ]\n      }\n    },\n    \"/api/v1/vacation-balances/{id}\"\
    : {\n      \"delete\": {\n        \"tags\": [\n          \"Vacation balances\"\
    \n        ],\n        \"summary\": \"Delete a balance row\",\n        \"operationId\"\
    : \"delete_2\",\n        \"parameters\": [\n          {\n            \"name\"\
    : \"id\",\n            \"in\": \"path\",\n            \"required\": true,\n  \
    \          \"schema\": {\n              \"type\": \"string\",\n              \"\
    format\": \"uuid\"\n            }\n          }\n        ],\n        \"responses\"\
    : {\n          \"204\": {\n            \"description\": \"Deleted\"\n        \
    \  },\n          \"404\": {\n            \"description\": \"Not found in this\
    \ tenant\"\n          }\n        },\n        \"security\": [\n          {\n  \
    \          \"bearerAuth\": []\n          }\n        ]\n      }\n    }\n  },\n\
    \  \"components\": {\n    \"schemas\": {\n      \"VacationBalanceRequest\": {\n\
    \        \"required\": [\n          \"employeeId\",\n          \"year\"\n    \
    \    ],\n        \"type\": \"object\",\n        \"properties\": {\n          \"\
    employeeId\": {\n            \"type\": \"string\",\n            \"format\": \"\
    uuid\"\n          },\n          \"year\": {\n            \"maximum\": 2100,\n\
    \            \"minimum\": 2000,\n            \"type\": \"integer\",\n        \
    \    \"format\": \"int32\"\n          },\n          \"entitledDays\": {\n    \
    \        \"minimum\": 0.0,\n            \"exclusiveMinimum\": false,\n       \
    \     \"type\": \"number\"\n          },\n          \"carriedDays\": {\n     \
    \       \"minimum\": 0.0,\n            \"exclusiveMinimum\": false,\n        \
    \    \"type\": \"number\"\n          },\n          \"extraDays\": {\n        \
    \    \"minimum\": 0.0,\n            \"exclusiveMinimum\": false,\n           \
    \ \"type\": \"number\"\n          },\n          \"notes\": {\n            \"maxLength\"\
    : 500,\n            \"minLength\": 0,\n            \"type\": \"string\"\n    \
    \      }\n        }\n      },\n      \"VacationBalanceResponse\": {\n        \"\
