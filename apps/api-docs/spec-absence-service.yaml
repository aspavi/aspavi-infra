    \                  \"$ref\": \"#/components/schemas/AbsenceTypeResponse\"\n  \
    \              }\n              }\n            }\n          },\n          \"200\"\
    : {\n            \"description\": \"Found\",\n            \"content\": {\n   \
    \           \"*/*\": {\n                \"schema\": {\n                  \"$ref\"\
    : \"#/components/schemas/AbsenceTypeResponse\"\n                }\n          \
    \    }\n            }\n          }\n        },\n        \"security\": [\n    \
    \      {\n            \"bearerAuth\": []\n          }\n        ]\n      },\n \
    \     \"put\": {\n        \"tags\": [\n          \"Absence types\"\n        ],\n\
    \        \"summary\": \"Update an absence type\",\n        \"operationId\": \"\
