    \       \"summary\": \"List balances for a year (defaults to the current one)\"\
    ,\n        \"operationId\": \"list\",\n        \"parameters\": [\n          {\n\
    \            \"name\": \"year\",\n            \"in\": \"query\",\n           \
    \ \"required\": false,\n            \"schema\": {\n              \"type\": \"\
    integer\",\n              \"format\": \"int32\"\n            }\n          }\n\
    \        ],\n        \"responses\": {\n          \"200\": {\n            \"description\"\
    : \"OK\",\n            \"content\": {\n              \"*/*\": {\n            \
    \    \"schema\": {\n                  \"type\": \"array\",\n                 \
    \ \"items\": {\n                    \"$ref\": \"#/components/schemas/VacationBalanceResponse\"\
    \n                  }\n                }\n              }\n            }\n   \
    \       }\n        },\n        \"security\": [\n          {\n            \"bearerAuth\"\
    : []\n          }\n        ]\n      },\n      \"put\": {\n        \"tags\": [\n\
    \          \"Vacation balances\"\n        ],\n        \"summary\": \"Create or\
    \ update the balance for an employee and year\",\n        \"operationId\": \"\
