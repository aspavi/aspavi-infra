    \n              }\n            }\n          },\n          \"required\": true\n\
    \        },\n        \"responses\": {\n          \"200\": {\n            \"description\"\
    : \"Updated\",\n            \"content\": {\n              \"*/*\": {\n       \
    \         \"schema\": {\n                  \"$ref\": \"#/components/schemas/AbsenceTypeResponse\"\
    \n                }\n              }\n            }\n          },\n          \"\
    409\": {\n            \"description\": \"Code already used in this tenant\",\n\
    \            \"content\": {\n              \"*/*\": {\n                \"schema\"\
    : {\n                  \"$ref\": \"#/components/schemas/AbsenceTypeResponse\"\n\
    \                }\n              }\n            }\n          },\n          \"\
    404\": {\n            \"description\": \"Not found in this tenant\",\n       \
    \     \"content\": {\n              \"*/*\": {\n                \"schema\": {\n\
    \                  \"$ref\": \"#/components/schemas/AbsenceTypeResponse\"\n  \
    \              }\n              }\n            }\n          }\n        },\n  \
    \      \"security\": [\n          {\n            \"bearerAuth\": []\n        \
    \  }\n        ]\n      },\n      \"delete\": {\n        \"tags\": [\n        \
    \  \"Absence types\"\n        ],\n        \"summary\": \"Delete an absence type\"\
