apiVersion: v1
data:
  absence-service.json: "{\n  \"openapi\": \"3.0.1\",\n  \"info\": {\n    \"title\"\
    : \"Absence Service API\",\n    \"description\": \"Microservicio para gestion\
    \ de ausencias y vacaciones\",\n    \"contact\": {\n      \"name\": \"Aspavi\"\
    ,\n      \"url\": \"https://aspavi.com\",\n      \"email\": \"contact@aspavi.com\"\
    \n    },\n    \"license\": {\n      \"name\": \"Apache 2.0\",\n      \"url\":\
    \ \"https://www.apache.org/licenses/LICENSE-2.0.html\"\n    },\n    \"version\"\
    : \"1.0.0\"\n  },\n  \"servers\": [\n    {\n      \"url\": \"https://api.aspavi.com/absence\"\
    \n    }\n  ],\n  \"tags\": [\n    {\n      \"name\": \"Absence types\",\n    \
    \  \"description\": \"Catalogue of absence kinds per tenant\"\n    },\n    {\n\
    \      \"name\": \"Absence requests\",\n      \"description\": \"Time-off requests\
    \ and their approval lifecycle\"\n    },\n    {\n      \"name\": \"Vacation balances\"\
    ,\n      \"description\": \"Entitlement vs. days taken, per employee and year\"\
