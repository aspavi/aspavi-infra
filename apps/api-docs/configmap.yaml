    : \"+34612345678\"\n          },\n          \"address\": {\n            \"type\"\
    : \"string\",\n            \"description\": \"Direcci\\u00f3n del empleado\",\n\
    \            \"example\": \"Calle Principal 123\"\n          }\n        },\n \
    \       \"description\": \"DTO para crear un nuevo empleado\"\n      },\n    \
