  audit-service.json: "{\n  \"openapi\": \"3.0.1\",\n  \"info\": {\n    \"title\": \"Audit Service API\",\n    \"description\": \"Microservicio de auditor\\u00eda y registro de eventos\",\n    \"version\": \"1.0.0\"\n  },\n  \"servers\": [\n    {\n      \"url\": \"https://api.aspavi.com\"\n    }\n  ],\n  \"security\": [\n    {\n      \"Bearer\": []\n    }\n  ],\n  \"tags\": [\n    {\n      \"name\": \"Audit Logs\",\n      \"description\": \"API for managing audit logs and events\"\n    }\n  ],\n  \"paths\": {\n    \"/api/v1/audit-logs\": {\n      \"get\": {\n        \"tags\": [\n          \"Audit Logs\"\n        ],\n        \"summary\": \"Find all audit logs\",\n        \"description\": \"Find all audit logs with optional filters (paged)\",\n        \"operationId\": \"findAll\",\n        \"parameters\": [\n          {\n            \"name\": \"page\",\n            \"in\": \"query\",\n            \"required\": false,\n            \"schema\": {\n              \"type\": \"integer\",\n              \"format\": \"int32\",\n              \"default\": 0\n            }\n          },\n          {\n            \"name\": \"size\",\n            \"in\": \"query\",\n            \"required\": false,\n            \"schema\": {\n              \"type\": \"integer\",\n              \"format\": \"int32\",\n              \"default\": 20\n            }\n          },\n          {\n            \"name\": \"entityType\",\n            \"in\": \"query\",\n            \"required\": false,\n            \"schema\": {\n              \"type\": \"string\"\n            }\n          },\n          {\n            \"name\": \"entityId\",\n            \"in\": \"query\",\n            \"required\": false,\n            \"schema\": {\n              \"type\": \"string\",\n              \"format\": \"uuid\"\n            }\n          }\n        ],\n        \"responses\": {\n          \"200\": {\n            \"description\": \"OK\",\n            \"content\": {\n              \"*/*\": {\n                \"schema\": {\n                  \"$ref\": \"#/components/schemas/PageAuditLogResponse\"\n                }\n              }\n            }\n          }\n        },\n        \"security\": [\n          {\n            \"Bearer\": []\n          }\n        ]\n      },\n      \"post\": {\n        \"tags\": [\n          \"Audit Logs\"\n        ],\n        \"summary\": \"Record an audit event\",\n        \"description\": \"Internal endpoint for other microservices to record events\",\n        \"operationId\": \"recordEvent\",\n        \"requestBody\": {\n          \"content\": {\n            \"application/json\": {\n              \"schema\": {\n                \"$ref\": \"#/components/schemas/AuditLogRequest\"\n              }\n            }\n          },\n          \"required\": true\n        },\n        \"responses\": {\n          \"200\": {\n            \"description\": \"OK\",\n            \"content\": {\n              \"*/*\": {\n                \"schema\": {\n                  \"$ref\": \"#/components/schemas/AuditLogResponse\"\n                }\n              }\n            }\n          }\n        },\n        \"security\": [\n          {\n            \"Bearer\": []\n          }\n        ]\n      }\n    },\n    \"/api/v1/audit-logs/{id}\": {\n      \"get\": {\n        \"tags\": [\n          \"Audit Logs\"\n        ],\n        \"summary\": \"Get audit log by ID\",\n        \"operationId\": \"findById\",\n        \"parameters\": [\n          {\n            \"name\": \"id\",\n            \"in\": \"path\",\n            \"required\": true,\n            \"schema\": {\n              \"type\": \"string\",\n              \"format\": \"uuid\"\n            }\n          }\n        ],\n        \"responses\": {\n          \"200\": {\n            \"description\": \"OK\",\n            \"content\": {\n              \"*/*\": {\n                \"schema\": {\n                  \"$ref\": \"#/components/schemas/AuditLogResponse\"\n                }\n              }\n            }\n          }\n        },\n        \"security\": [\n          {\n            \"Bearer\": []\n          }\n        ]\n      }\n    },\n    \"/api/v1/audit-logs/entity/{entityId}\": {\n      \"get\": {\n        \"tags\": [\n          \"Audit Logs\"\n        ],\n        \"summary\": \"Get complete history of an entity\",\n        \"operationId\": \"findByEntityId\",\n        \"parameters\": [\n          {\n            \"name\": \"entityId\",\n            \"in\": \"path\",\n            \"required\": true,\n            \"schema\": {\n              \"type\": \"string\",\n              \"format\": \"uuid\"\n            }\n          }\n        ],\n        \"responses\": {\n          \"200\": {\n            \"description\": \"OK\",\n            \"content\": {\n              \"*/*\": {\n                \"schema\": {\n                  \"type\": \"array\",\n                  \"items\": {\n                    \"$ref\": \"#/components/schemas/AuditLogResponse\"\n                  }\n                }\n              }\n            }\n          }\n        },\n        \"security\": [\n          {\n            \"Bearer\": []\n          }\n        ]\n      }\n    }\n  },\n  \"components\": {\n    \"schemas\": {\n      \"AuditLogRequest\": {\n        \"required\": [\n          \"action\",\n          \"changedBy\",\n          \"entityId\",\n          \"entityType\"\n        ],\n        \"type\": \"object\",\n        \"properties\": {\n          \"entityType\": {\n            \"type\": \"string\"\n          },\n          \"entityId\": {\n            \"type\": \"string\",\n            \"format\": \"uuid\"\n          },\n          \"action\": {\n            \"type\": \"string\"\n          },\n          \"changedBy\": {\n            \"type\": \"string\"\n          },\n          \"oldValues\": {\n            \"type\": \"string\"\n          },\n          \"newValues\": {\n            \"type\": \"string\"\n          },\n          \"ipAddress\": {\n            \"type\": \"string\"\n          },\n          \"userAgent\": {\n            \"type\": \"string\"\n          }\n        }\n      },\n      \"AuditLogResponse\": {\n        \"type\": \"object\",\n        \"properties\": {\n          \"id\": {\n            \"type\": \"string\",\n            \"format\": \"uuid\"\n          },\n          \"tenantId\": {\n            \"type\": \"string\"\n          },\n          \"entityType\": {\n            \"type\": \"string\"\n          },\n          \"entityId\": {\n            \"type\": \"string\",\n            \"format\": \"uuid\"\n          },\n          \"action\": {\n            \"type\": \"string\"\n          },\n          \"changedBy\": {\n            \"type\": \"string\"\n          },\n          \"changedAt\": {\n            \"type\": \"string\",\n            \"format\": \"date-time\"\n          },\n          \"oldValues\": {\n            \"type\": \"string\"\n          },\n          \"newValues\": {\n            \"type\": \"string\"\n          },\n          \"ipAddress\": {\n            \"type\": \"string\"\n          },\n          \"userAgent\": {\n            \"type\": \"string\"\n          }\n        }\n      },\n      \"PageAuditLogResponse\": {\n        \"type\": \"object\",\n        \"properties\": {\n          \"totalElements\": {\n            \"type\": \"integer\",\n            \"format\": \"int64\"\n          },\n          \"totalPages\": {\n            \"type\": \"integer\",\n            \"format\": \"int32\"\n          },\n          \"size\": {\n            \"type\": \"integer\",\n            \"format\": \"int32\"\n          },\n          \"content\": {\n            \"type\": \"array\",\n            \"items\": {\n              \"$ref\": \"#/components/schemas/AuditLogResponse\"\n            }\n          },\n          \"number\": {\n            \"type\": \"integer\",\n            \"format\": \"int32\"\n          },\n          \"pageable\": {\n            \"$ref\": \"#/components/schemas/PageableObject\"\n          },\n          \"sort\": {\n            \"$ref\": \"#/components/schemas/SortObject\"\n          },\n          \"numberOfElements\": {\n            \"type\": \"integer\",\n            \"format\": \"int32\"\n          },\n          \"first\": {\n            \"type\": \"boolean\"\n          },\n          \"last\": {\n            \"type\": \"boolean\"\n          },\n          \"empty\": {\n            \"type\": \"boolean\"\n          }\n        }\n      },\n      \"PageableObject\": {\n        \"type\": \"object\",\n        \"properties\": {\n          \"offset\": {\n            \"type\": \"integer\",\n            \"format\": \"int64\"\n          },\n          \"pageNumber\": {\n            \"type\": \"integer\",\n            \"format\": \"int32\"\n          },\n          \"pageSize\": {\n            \"type\": \"integer\",\n            \"format\": \"int32\"\n          },\n          \"paged\": {\n            \"type\": \"boolean\"\n          },\n          \"sort\": {\n            \"$ref\": \"#/components/schemas/SortObject\"\n          },\n          \"unpaged\": {\n            \"type\": \"boolean\"\n          }\n        }\n      },\n      \"SortObject\": {\n        \"type\": \"object\",\n        \"properties\": {\n          \"empty\": {\n            \"type\": \"boolean\"\n          },\n          \"sorted\": {\n            \"type\": \"boolean\"\n          },\n          \"unsorted\": {\n            \"type\": \"boolean\"\n          }\n        }\n      }\n    },\n    \"securitySchemes\": {\n      \"Bearer\": {\n        \"type\": \"http\",\n        \"description\": \"JWT token from Keycloak\",\n        \"scheme\": \"bearer\",\n        \"bearerFormat\": \"JWT\"\n      }\n    }\n  }\n}"
  organization-service.json: "{\n  \"openapi\": \"3.0.1\",\n  \"info\": {\n    \"title\": \"Organization Service API\",\n    \"description\": \"REST API for work center management\",\n    \"version\": \"1.0.0\"\n  },\n  \"servers\": [\n    {\n      \"url\": \"https://api.aspavi.com/organization\"\n    }\n  ],\n  \"tags\": [\n    {\n      \"name\": \"Work Centers\",\n      \"description\": \"Work centers management\"\n    },\n    {\n      \"name\": \"Job Positions\",\n      \"description\": \"Job positions catalogue management\"\n    }\n  ],\n  \"paths\": {\n    \"/api/v1/work-centers/{id}\": {\n      \"get\": {\n        \"tags\": [\n          \"Work Centers\"\n        ],\n        \"summary\": \"Get work center by ID\",\n        \"operationId\": \"getById\",\n        \"parameters\": [\n          {\n            \"name\": \"id\",\n            \"in\": \"path\",\n            \"required\": true,\n            \"schema\": {\n              \"type\": \"string\",\n              \"format\": \"uuid\"\n            }\n          }\n        ],\n        \"responses\": {\n          \"200\": {\n            \"description\": \"OK\",\n            \"content\": {\n              \"*/*\": {\n                \"schema\": {\n                  \"$ref\": \"#/components/schemas/WorkCenterResponse\"\n                }\n              }\n            }\n          }\n        },\n        \"security\": [\n          {\n            \"bearerAuth\": []\n          }\n        ]\n      },\n      \"put\": {\n        \"tags\": [\n          \"Work Centers\"\n        ],\n        \"summary\": \"Update work center\",\n        \"operationId\": \"update\",\n        \"parameters\": [\n          {\n            \"name\": \"id\",\n            \"in\": \"path\",\n            \"required\": true,\n            \"schema\": {\n              \"type\": \"string\",\n              \"format\": \"uuid\"\n            }\n          }\n        ],\n        \"requestBody\": {\n          \"content\": {\n            \"application/json\": {\n              \"schema\": {\n                \"$ref\": \"#/components/schemas/WorkCenterRequest\"\n              }\n            }\n          },\n          \"required\": true\n        },\n        \"responses\": {\n          \"200\": {\n            \"description\": \"OK\",\n            \"content\": {\n              \"*/*\": {\n                \"schema\": {\n                  \"$ref\": \"#/components/schemas/WorkCenterResponse\"\n                }\n              }\n            }\n          }\n        },\n        \"security\": [\n          {\n            \"bearerAuth\": []\n          }\n        ]\n      },\n      \"delete\": {\n        \"tags\": [\n          \"Work Centers\"\n        ],\n        \"summary\": \"Delete work center\",\n        \"operationId\": \"delete\",\n        \"parameters\": [\n          {\n            \"name\": \"id\",\n            \"in\": \"path\",\n            \"required\": true,\n            \"schema\": {\n              \"type\": \"string\",\n              \"format\": \"uuid\"\n            }\n          }\n        ],\n        \"responses\": {\n          \"200\": {\n            \"description\": \"OK\"\n          }\n        },\n        \"security\": [\n          {\n            \"bearerAuth\": []\n          }\n        ]\n      }\n    },\n    \"/api/v1/job-positions/{id}\": {\n      \"get\": {\n        \"tags\": [\n          \"Job Positions\"\n        ],\n        \"summary\": \"Get job position by ID\",\n        \"operationId\": \"getById_1\",\n        \"parameters\": [\n          {\n            \"name\": \"id\",\n            \"in\": \"path\",\n            \"required\": true,\n            \"schema\": {\n              \"type\": \"string\",\n              \"format\": \"uuid\"\n            }\n          }\n        ],\n        \"responses\": {\n          \"200\": {\n            \"description\": \"OK\",\n            \"content\": {\n              \"*/*\": {\n                \"schema\": {\n                  \"$ref\": \"#/components/schemas/JobPositionResponse\"\n                }\n              }\n            }\n          }\n        },\n        \"security\": [\n          {\n            \"bearerAuth\": []\n          }\n        ]\n      },\n      \"put\": {\n        \"tags\": [\n          \"Job Positions\"\n        ],\n        \"summary\": \"Update job position\",\n        \"operationId\": \"update_1\",\n        \"parameters\": [\n          {\n            \"name\": \"id\",\n            \"in\": \"path\",\n            \"required\": true,\n            \"schema\": {\n              \"type\": \"string\",\n              \"format\": \"uuid\"\n            }\n          }\n        ],\n        \"requestBody\": {\n          \"content\": {\n            \"application/json\": {\n              \"schema\": {\n                \"$ref\": \"#/components/schemas/JobPositionRequest\"\n              }\n            }\n          },\n          \"required\": true\n        },\n        \"responses\": {\n          \"200\": {\n            \"description\": \"OK\",\n            \"content\": {\n              \"*/*\": {\n                \"schema\": {\n                  \"$ref\": \"#/components/schemas/JobPositionResponse\"\n                }\n              }\n            }\n          }\n        },\n        \"security\": [\n          {\n            \"bearerAuth\": []\n          }\n        ]\n      },\n      \"delete\": {\n        \"tags\": [\n          \"Job Positions\"\n        ],\n        \"summary\": \"Delete job position\",\n        \"operationId\": \"delete_1\",\n        \"parameters\": [\n          {\n            \"name\": \"id\",\n            \"in\": \"path\",\n            \"required\": true,\n            \"schema\": {\n              \"type\": \"string\",\n              \"format\": \"uuid\"\n            }\n          }\n        ],\n        \"responses\": {\n          \"200\": {\n            \"description\": \"OK\"\n          }\n        },\n        \"security\": [\n          {\n            \"bearerAuth\": []\n          }\n        ]\n      }\n    },\n    \"/api/v1/work-centers\": {\n      \"get\": {\n        \"tags\": [\n          \"Work Centers\"\n        ],\n        \"summary\": \"Get all work centers\",\n        \"operationId\": \"getAll\",\n        \"responses\": {\n          \"200\": {\n            \"description\": \"OK\",\n            \"content\": {\n              \"*/*\": {\n                \"schema\": {\n                  \"type\": \"array\",\n                  \"items\": {\n                    \"$ref\": \"#/components/schemas/WorkCenterResponse\"\n                  }\n                }\n              }\n            }\n          }\n        },\n        \"security\": [\n          {\n            \"bearerAuth\": []\n          }\n        ]\n      },\n      \"post\": {\n        \"tags\": [\n          \"Work Centers\"\n        ],\n        \"summary\": \"Create work center\",\n        \"operationId\": \"create\",\n        \"requestBody\": {\n          \"content\": {\n            \"application/json\": {\n              \"schema\": {\n                \"$ref\": \"#/components/schemas/WorkCenterRequest\"\n              }\n            }\n          },\n          \"required\": true\n        },\n        \"responses\": {\n          \"200\": {\n            \"description\": \"OK\",\n            \"content\": {\n              \"*/*\": {\n                \"schema\": {\n                  \"$ref\": \"#/components/schemas/WorkCenterResponse\"\n                }\n              }\n            }\n          }\n        },\n        \"security\": [\n          {\n            \"bearerAuth\": []\n          }\n        ]\n      }\n    },\n    \"/api/v1/job-positions\": {\n      \"get\": {\n        \"tags\": [\n          \"Job Positions\"\n        ],\n        \"summary\": \"Get all job positions\",\n        \"operationId\": \"getAll_1\",\n        \"responses\": {\n          \"200\": {\n            \"description\": \"OK\",\n            \"content\": {\n              \"*/*\": {\n                \"schema\": {\n                  \"type\": \"array\",\n                  \"items\": {\n                    \"$ref\": \"#/components/schemas/JobPositionResponse\"\n                  }\n                }\n              }\n            }\n          }\n        },\n        \"security\": [\n          {\n            \"bearerAuth\": []\n          }\n        ]\n      },\n      \"post\": {\n        \"tags\": [\n          \"Job Positions\"\n        ],\n        \"summary\": \"Create job position\",\n        \"operationId\": \"create_1\",\n        \"requestBody\": {\n          \"content\": {\n            \"application/json\": {\n              \"schema\": {\n                \"$ref\": \"#/components/schemas/JobPositionRequest\"\n              }\n            }\n          },\n          \"required\": true\n        },\n        \"responses\": {\n          \"200\": {\n            \"description\": \"OK\",\n            \"content\": {\n              \"*/*\": {\n                \"schema\": {\n                  \"$ref\": \"#/components/schemas/JobPositionResponse\"\n                }\n              }\n            }\n          }\n        },\n        \"security\": [\n          {\n            \"bearerAuth\": []\n          }\n        ]\n      }\n    }\n  },\n  \"components\": {\n    \"schemas\": {\n      \"WorkCenterRequest\": {\n        \"required\": [\n          \"address\",\n          \"city\",\n          \"name\",\n          \"postalCode\",\n          \"province\"\n        ],\n        \"type\": \"object\",\n        \"properties\": {\n          \"name\": {\n            \"type\": \"string\"\n          },\n          \"address\": {\n            \"type\": \"string\"\n          },\n          \"city\": {\n            \"type\": \"string\"\n          },\n          \"province\": {\n            \"type\": \"string\"\n          },\n          \"postalCode\": {\n            \"type\": \"string\"\n          },\n          \"country\": {\n            \"type\": \"string\"\n          },\n          \"isActive\": {\n            \"type\": \"boolean\"\n          },\n          \"code\": {\n            \"type\": \"string\"\n          },\n          \"workCalendarId\": {\n            \"type\": \"string\",\n            \"format\": \"uuid\"\n          },\n          \"responsableId\": {\n            \"type\": \"string\",\n            \"format\": \"uuid\"\n          },\n          \"notes\": {\n            \"type\": \"string\"\n          }\n        }\n      },\n      \"WorkCenterResponse\": {\n        \"type\": \"object\",\n        \"properties\": {\n          \"id\": {\n            \"type\": \"string\",\n            \"format\": \"uuid\"\n          },\n          \"name\": {\n            \"type\": \"string\"\n          },\n          \"address\": {\n            \"type\": \"string\"\n          },\n          \"city\": {\n            \"type\": \"string\"\n          },\n          \"province\": {\n            \"type\": \"string\"\n          },\n          \"postalCode\": {\n            \"type\": \"string\"\n          },\n          \"country\": {\n            \"type\": \"string\"\n          },\n          \"isActive\": {\n            \"type\": \"boolean\"\n          },\n          \"code\": {\n            \"type\": \"string\"\n          },\n          \"workCalendarId\": {\n            \"type\": \"string\",\n            \"format\": \"uuid\"\n          },\n          \"responsableId\": {\n            \"type\": \"string\",\n            \"format\": \"uuid\"\n          },\n          \"notes\": {\n            \"type\": \"string\"\n          },\n          \"createdAt\": {\n            \"type\": \"string\",\n            \"format\": \"date-time\"\n          },\n          \"updatedAt\": {\n            \"type\": \"string\",\n            \"format\": \"date-time\"\n          }\n        }\n      },\n      \"JobPositionCategoryDto\": {\n        \"required\": [\n          \"convenioCategoryId\",\n          \"convenioId\"\n        ],\n        \"type\": \"object\",\n        \"properties\": {\n          \"convenioId\": {\n            \"type\": \"string\",\n            \"format\": \"uuid\"\n          },\n          \"convenioCategoryId\": {\n            \"type\": \"string\",\n            \"format\": \"uuid\"\n          }\n        }\n      },\n      \"JobPositionRequest\": {\n        \"required\": [\n          \"name\"\n        ],\n        \"type\": \"object\",\n        \"properties\": {\n          \"name\": {\n            \"type\": \"string\"\n          },\n          \"code\": {\n            \"type\": \"string\"\n          },\n          \"department\": {\n            \"type\": \"string\"\n          },\n          \"level\": {\n            \"type\": \"string\",\n            \"enum\": [\n              \"JUNIOR\",\n              \"INTERMEDIO\",\n              \"SENIOR\",\n              \"LEAD\",\n              \"DIRECCION\"\n            ]\n          },\n          \"description\": {\n            \"type\": \"string\"\n          },\n          \"categories\": {\n            \"type\": \"array\",\n            \"items\": {\n              \"$ref\": \"#/components/schemas/JobPositionCategoryDto\"\n            }\n          },\n          \"isActive\": {\n            \"type\": \"boolean\"\n          },\n          \"vacancies\": {\n            \"type\": \"integer\",\n            \"format\": \"int32\"\n          },\n          \"functions\": {\n            \"type\": \"array\",\n            \"items\": {\n              \"type\": \"string\"\n            }\n          }\n        }\n      },\n      \"JobPositionResponse\": {\n        \"type\": \"object\",\n        \"properties\": {\n          \"id\": {\n            \"type\": \"string\",\n            \"format\": \"uuid\"\n          },\n          \"name\": {\n            \"type\": \"string\"\n          },\n          \"code\": {\n            \"type\": \"string\"\n          },\n          \"department\": {\n            \"type\": \"string\"\n          },\n          \"level\": {\n            \"type\": \"string\",\n            \"enum\": [\n              \"JUNIOR\",\n              \"INTERMEDIO\",\n              \"SENIOR\",\n              \"LEAD\",\n              \"DIRECCION\"\n            ]\n          },\n          \"description\": {\n            \"type\": \"string\"\n          },\n          \"categories\": {\n            \"type\": \"array\",\n            \"items\": {\n              \"$ref\": \"#/components/schemas/JobPositionCategoryDto\"\n            }\n          },\n          \"isActive\": {\n            \"type\": \"boolean\"\n          },\n          \"vacancies\": {\n            \"type\": \"integer\",\n            \"format\": \"int32\"\n          },\n          \"functions\": {\n            \"type\": \"array\",\n            \"items\": {\n              \"type\": \"string\"\n            }\n          },\n          \"createdAt\": {\n            \"type\": \"string\",\n            \"format\": \"date-time\"\n          },\n          \"updatedAt\": {\n            \"type\": \"string\",\n            \"format\": \"date-time\"\n          }\n        }\n      }\n    },\n    \"securitySchemes\": {\n      \"bearerAuth\": {\n        \"type\": \"http\",\n        \"description\": \"Keycloak JWT access token. Obtain via POST /realms/{realm}/protocol/openid-connect/token\",\n        \"scheme\": \"bearer\",\n        \"bearerFormat\": \"JWT\"\n      }\n    }\n  }\n}"
