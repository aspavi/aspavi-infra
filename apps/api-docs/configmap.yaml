    \       }\n        ],\n        \"requestBody\": {\n          \"content\": {\n\
    \            \"application/json\": {\n              \"schema\": {\n          \
    \      \"$ref\": \"#/components/schemas/EmployeeUpdateRequest\"\n            \
    \  }\n            }\n          },\n          \"required\": true\n        },\n\
    \        \"responses\": {\n          \"200\": {\n            \"description\":\
