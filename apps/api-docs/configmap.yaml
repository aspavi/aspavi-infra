    \n    }\n  ],\n  \"tags\": [\n    {\n      \"name\": \"Employees\",\n      \"\
    description\": \"API para gestionar empleados\"\n    }\n  ],\n  \"paths\": {\n\
    \    \"/api/v1/employees/{id}\": {\n      \"get\": {\n        \"tags\": [\n  \
    \        \"Employees\"\n        ],\n        \"summary\": \"Obtener empleado por\
