apiVersion: v1
data:
  attendance-service.json: "{\n  \"openapi\": \"3.0.1\",\n  \"info\": {\n    \"title\"\
    : \"Attendance Service API\",\n    \"description\": \"Microservicio para registro\
    \ de jornada y fichajes\",\n    \"contact\": {\n      \"name\": \"Aspavi\",\n\
    \      \"url\": \"https://aspavi.com\",\n      \"email\": \"contact@aspavi.com\"\
    \n    },\n    \"license\": {\n      \"name\": \"Apache 2.0\",\n      \"url\":\
    \ \"https://www.apache.org/licenses/LICENSE-2.0.html\"\n    },\n    \"version\"\
    : \"1.0.0\"\n  },\n  \"servers\": [\n    {\n      \"url\": \"https://api.aspavi.com/attendance\"\
    \n    }\n  ],\n  \"tags\": [\n    {\n      \"name\": \"Time corrections\",\n \
    \     \"description\": \"The only way the punch record changes\"\n    },\n   \
    \ {\n      \"name\": \"Time entries\",\n      \"description\": \"Clock-in records.\
    \ Append-only: never edited, only corrected\"\n    },\n    {\n      \"name\":\
    \ \"Work days\",\n      \"description\": \"Daily totals derived from the punches\"\
    \n    }\n  ],\n  \"paths\": {\n    \"/api/v1/time-corrections/{id}\": {\n    \
    \  \"get\": {\n        \"tags\": [\n          \"Time corrections\"\n        ],\n\
    \        \"summary\": \"Get a correction\",\n        \"operationId\": \"get\"\
    ,\n        \"parameters\": [\n          {\n            \"name\": \"id\",\n   \
    \         \"in\": \"path\",\n            \"required\": true,\n            \"schema\"\
    : {\n              \"type\": \"string\",\n              \"format\": \"uuid\"\n\
    \            }\n          }\n        ],\n        \"responses\": {\n          \"\
    404\": {\n            \"description\": \"Not found in this tenant\",\n       \
    \     \"content\": {\n              \"*/*\": {\n                \"schema\": {\n\
    \                  \"$ref\": \"#/components/schemas/TimeCorrectionResponse\"\n\
    \                }\n              }\n            }\n          },\n          \"\
    200\": {\n            \"description\": \"Found\",\n            \"content\": {\n\
    \              \"*/*\": {\n                \"schema\": {\n                  \"\
    $ref\": \"#/components/schemas/TimeCorrectionResponse\"\n                }\n \
    \             }\n            }\n          }\n        },\n        \"security\"\
    : [\n          {\n            \"bearerAuth\": []\n          }\n        ]\n   \
    \   },\n      \"put\": {\n        \"tags\": [\n          \"Time corrections\"\n\
    \        ],\n        \"summary\": \"Update a pending correction\",\n        \"\
    operationId\": \"update\",\n        \"parameters\": [\n          {\n         \
    \   \"name\": \"id\",\n            \"in\": \"path\",\n            \"required\"\
    : true,\n            \"schema\": {\n              \"type\": \"string\",\n    \
    \          \"format\": \"uuid\"\n            }\n          }\n        ],\n    \
    \    \"requestBody\": {\n          \"content\": {\n            \"application/json\"\
    : {\n              \"schema\": {\n                \"$ref\": \"#/components/schemas/TimeCorrectionRequest\"\
    \n              }\n            }\n          },\n          \"required\": true\n\
    \        },\n        \"responses\": {\n          \"409\": {\n            \"description\"\
    : \"Already decided\",\n            \"content\": {\n              \"*/*\": {\n\
    \                \"schema\": {\n                  \"$ref\": \"#/components/schemas/TimeCorrectionResponse\"\
    \n                }\n              }\n            }\n          },\n          \"\
    200\": {\n            \"description\": \"Updated\",\n            \"content\":\
    \ {\n              \"*/*\": {\n                \"schema\": {\n               \
    \   \"$ref\": \"#/components/schemas/TimeCorrectionResponse\"\n              \
    \  }\n              }\n            }\n          },\n          \"400\": {\n   \
    \         \"description\": \"Payload does not match what the kind requires\",\n\
    \            \"content\": {\n              \"*/*\": {\n                \"schema\"\
    : {\n                  \"$ref\": \"#/components/schemas/TimeCorrectionResponse\"\
    \n                }\n              }\n            }\n          },\n          \"\
    404\": {\n            \"description\": \"Not found in this tenant\",\n       \
    \     \"content\": {\n              \"*/*\": {\n                \"schema\": {\n\
    \                  \"$ref\": \"#/components/schemas/TimeCorrectionResponse\"\n\
    \                }\n              }\n            }\n          }\n        },\n\
    \        \"security\": [\n          {\n            \"bearerAuth\": []\n      \
    \    }\n        ]\n      },\n      \"delete\": {\n        \"tags\": [\n      \
    \    \"Time corrections\"\n        ],\n        \"summary\": \"Delete a correction\
    \ that was never approved\",\n        \"operationId\": \"delete\",\n        \"\
    parameters\": [\n          {\n            \"name\": \"id\",\n            \"in\"\
    : \"path\",\n            \"required\": true,\n            \"schema\": {\n    \
    \          \"type\": \"string\",\n              \"format\": \"uuid\"\n       \
    \     }\n          }\n        ],\n        \"responses\": {\n          \"204\"\
    : {\n            \"description\": \"Deleted\"\n          },\n          \"404\"\
    : {\n            \"description\": \"Not found in this tenant\"\n          },\n\
    \          \"409\": {\n            \"description\": \"Approved corrections are\
    \ part of the audit trail\"\n          }\n        },\n        \"security\": [\n\
    \          {\n            \"bearerAuth\": []\n          }\n        ]\n      }\n\
    \    },\n    \"/api/v1/work-days/{employeeId}/recompute\": {\n      \"post\":\
    \ {\n        \"tags\": [\n          \"Work days\"\n        ],\n        \"summary\"\
    : \"Rebuild a day's totals from its entries. Idempotent\",\n        \"operationId\"\
    : \"recompute\",\n        \"parameters\": [\n          {\n            \"name\"\
    : \"employeeId\",\n            \"in\": \"path\",\n            \"required\": true,\n\
    \            \"schema\": {\n              \"type\": \"string\",\n            \
    \  \"format\": \"uuid\"\n            }\n          },\n          {\n          \
    \  \"name\": \"date\",\n            \"in\": \"query\",\n            \"required\"\
    : true,\n            \"schema\": {\n              \"type\": \"string\",\n    \
    \          \"format\": \"date\"\n            }\n          }\n        ],\n    \
    \    \"requestBody\": {\n          \"content\": {\n            \"application/json\"\
    : {\n              \"schema\": {\n                \"$ref\": \"#/components/schemas/WorkDayComputeRequest\"\
    \n              }\n            }\n          }\n        },\n        \"responses\"\
    : {\n          \"200\": {\n            \"description\": \"OK\",\n            \"\
    content\": {\n              \"*/*\": {\n                \"schema\": {\n      \
    \            \"$ref\": \"#/components/schemas/WorkDayResponse\"\n            \
    \    }\n              }\n            }\n          }\n        },\n        \"security\"\
    : [\n          {\n            \"bearerAuth\": []\n          }\n        ]\n   \
    \   }\n    },\n    \"/api/v1/time-entries\": {\n      \"get\": {\n        \"tags\"\
    : [\n          \"Time entries\"\n        ],\n        \"summary\": \"Entries of\
    \ an employee for a day or a range, or of everyone for a day\",\n        \"operationId\"\
    : \"list\",\n        \"parameters\": [\n          {\n            \"name\": \"\
    employeeId\",\n            \"in\": \"query\",\n            \"required\": false,\n\
    \            \"schema\": {\n              \"type\": \"string\",\n            \
    \  \"format\": \"uuid\"\n            }\n          },\n          {\n          \
    \  \"name\": \"date\",\n            \"in\": \"query\",\n            \"required\"\
    : false,\n            \"schema\": {\n              \"type\": \"string\",\n   \
    \           \"format\": \"date\"\n            }\n          },\n          {\n \
    \           \"name\": \"from\",\n            \"in\": \"query\",\n            \"\
    required\": false,\n            \"schema\": {\n              \"type\": \"string\"\
    ,\n              \"format\": \"date\"\n            }\n          },\n         \
    \ {\n            \"name\": \"to\",\n            \"in\": \"query\",\n         \
    \   \"required\": false,\n            \"schema\": {\n              \"type\": \"\
    string\",\n              \"format\": \"date\"\n            }\n          }\n  \
    \      ],\n        \"responses\": {\n          \"200\": {\n            \"description\"\
    : \"OK\",\n            \"content\": {\n              \"*/*\": {\n            \
    \    \"schema\": {\n                  \"type\": \"array\",\n                 \
    \ \"items\": {\n                    \"$ref\": \"#/components/schemas/TimeEntryResponse\"\
    \n                  }\n                }\n              }\n            }\n   \
    \       }\n        },\n        \"security\": [\n          {\n            \"bearerAuth\"\
    : []\n          }\n        ]\n      },\n      \"post\": {\n        \"tags\": [\n\
    \          \"Time entries\"\n        ],\n        \"summary\": \"Record a punch.\
    \ Defaults to now when no instant is given\",\n        \"operationId\": \"create\"\
    ,\n        \"parameters\": [\n          {\n            \"name\": \"recordedBy\"\
    ,\n            \"in\": \"query\",\n            \"required\": false,\n        \
    \    \"schema\": {\n              \"type\": \"string\",\n              \"format\"\
    : \"uuid\"\n            }\n          }\n        ],\n        \"requestBody\": {\n\
    \          \"content\": {\n            \"application/json\": {\n             \
    \ \"schema\": {\n                \"$ref\": \"#/components/schemas/TimeEntryRequest\"\
    \n              }\n            }\n          },\n          \"required\": true\n\
    \        },\n        \"responses\": {\n          \"201\": {\n            \"description\"\
    : \"Recorded\",\n            \"content\": {\n              \"*/*\": {\n      \
    \          \"schema\": {\n                  \"$ref\": \"#/components/schemas/TimeEntryResponse\"\
    \n                }\n              }\n            }\n          }\n        },\n\
    \        \"security\": [\n          {\n            \"bearerAuth\": []\n      \
    \    }\n        ]\n      }\n    },\n    \"/api/v1/time-corrections\": {\n    \
    \  \"get\": {\n        \"tags\": [\n          \"Time corrections\"\n        ],\n\
    \        \"summary\": \"List corrections, optionally by employee and status\"\
    ,\n        \"operationId\": \"list_1\",\n        \"parameters\": [\n         \
    \ {\n            \"name\": \"employeeId\",\n            \"in\": \"query\",\n \
    \           \"required\": false,\n            \"schema\": {\n              \"\
    type\": \"string\",\n              \"format\": \"uuid\"\n            }\n     \
    \     },\n          {\n            \"name\": \"status\",\n            \"in\":\
    \ \"query\",\n            \"required\": false,\n            \"schema\": {\n  \
    \            \"type\": \"string\",\n              \"enum\": [\n              \
    \  \"PENDING\",\n                \"APPROVED\",\n                \"REJECTED\",\n\
    \                \"CANCELLED\"\n              ]\n            }\n          }\n\
    \        ],\n        \"responses\": {\n          \"200\": {\n            \"description\"\
    : \"OK\",\n            \"content\": {\n              \"*/*\": {\n            \
    \    \"schema\": {\n                  \"type\": \"array\",\n                 \
    \ \"items\": {\n                    \"$ref\": \"#/components/schemas/TimeCorrectionResponse\"\
    \n                  }\n                }\n              }\n            }\n   \
    \       }\n        },\n        \"security\": [\n          {\n            \"bearerAuth\"\
    : []\n          }\n        ]\n      },\n      \"post\": {\n        \"tags\": [\n\
    \          \"Time corrections\"\n        ],\n        \"summary\": \"Request a\
    \ correction: add a missing punch, amend one, or annul a duplicate\",\n      \
    \  \"operationId\": \"create_1\",\n        \"requestBody\": {\n          \"content\"\
    : {\n            \"application/json\": {\n              \"schema\": {\n      \
    \          \"$ref\": \"#/components/schemas/TimeCorrectionRequest\"\n        \
    \      }\n            }\n          },\n          \"required\": true\n        },\n\
    \        \"responses\": {\n          \"404\": {\n            \"description\":\
    \ \"Target entry not found in this tenant\",\n            \"content\": {\n   \
    \           \"*/*\": {\n                \"schema\": {\n                  \"$ref\"\
    : \"#/components/schemas/TimeCorrectionResponse\"\n                }\n       \
    \       }\n            }\n          },\n          \"400\": {\n            \"description\"\
    : \"Payload does not match what the kind requires\",\n            \"content\"\
    : {\n              \"*/*\": {\n                \"schema\": {\n               \
    \   \"$ref\": \"#/components/schemas/TimeCorrectionResponse\"\n              \
    \  }\n              }\n            }\n          },\n          \"201\": {\n   \
    \         \"description\": \"Created\",\n            \"content\": {\n        \
    \      \"*/*\": {\n                \"schema\": {\n                  \"$ref\":\
    \ \"#/components/schemas/TimeCorrectionResponse\"\n                }\n       \
    \       }\n            }\n          }\n        },\n        \"security\": [\n \
    \         {\n            \"bearerAuth\": []\n          }\n        ]\n      }\n\
    \    },\n    \"/api/v1/time-corrections/{id}/reject\": {\n      \"post\": {\n\
    \        \"tags\": [\n          \"Time corrections\"\n        ],\n        \"summary\"\
    : \"Reject a pending correction\",\n        \"operationId\": \"reject\",\n   \
    \     \"parameters\": [\n          {\n            \"name\": \"id\",\n        \
    \    \"in\": \"path\",\n            \"required\": true,\n            \"schema\"\
    : {\n              \"type\": \"string\",\n              \"format\": \"uuid\"\n\
    \            }\n          }\n        ],\n        \"requestBody\": {\n        \
    \  \"content\": {\n            \"application/json\": {\n              \"schema\"\
    : {\n                \"$ref\": \"#/components/schemas/CorrectionDecisionRequest\"\
    \n              }\n            }\n          },\n          \"required\": true\n\
    \        },\n        \"responses\": {\n          \"409\": {\n            \"description\"\
    : \"Already decided\",\n            \"content\": {\n              \"*/*\": {\n\
    \                \"schema\": {\n                  \"$ref\": \"#/components/schemas/TimeCorrectionResponse\"\
    \n                }\n              }\n            }\n          },\n          \"\
    200\": {\n            \"description\": \"Rejected\",\n            \"content\"\
    : {\n              \"*/*\": {\n                \"schema\": {\n               \
    \   \"$ref\": \"#/components/schemas/TimeCorrectionResponse\"\n              \
    \  }\n              }\n            }\n          },\n          \"404\": {\n   \
    \         \"description\": \"Not found in this tenant\",\n            \"content\"\
    : {\n              \"*/*\": {\n                \"schema\": {\n               \
    \   \"$ref\": \"#/components/schemas/TimeCorrectionResponse\"\n              \
    \  }\n              }\n            }\n          }\n        },\n        \"security\"\
    : [\n          {\n            \"bearerAuth\": []\n          }\n        ]\n   \
    \   }\n    },\n    \"/api/v1/time-corrections/{id}/cancel\": {\n      \"post\"\
    : {\n        \"tags\": [\n          \"Time corrections\"\n        ],\n       \
    \ \"summary\": \"Cancel a pending correction\",\n        \"operationId\": \"cancel\"\
    ,\n        \"parameters\": [\n          {\n            \"name\": \"id\",\n   \
    \         \"in\": \"path\",\n            \"required\": true,\n            \"schema\"\
    : {\n              \"type\": \"string\",\n              \"format\": \"uuid\"\n\
    \            }\n          }\n        ],\n        \"responses\": {\n          \"\
    200\": {\n            \"description\": \"OK\",\n            \"content\": {\n \
    \             \"*/*\": {\n                \"schema\": {\n                  \"\
    $ref\": \"#/components/schemas/TimeCorrectionResponse\"\n                }\n \
    \             }\n            }\n          }\n        },\n        \"security\"\
    : [\n          {\n            \"bearerAuth\": []\n          }\n        ]\n   \
    \   }\n    },\n    \"/api/v1/time-corrections/{id}/approve\": {\n      \"post\"\
    : {\n        \"tags\": [\n          \"Time corrections\"\n        ],\n       \
    \ \"summary\": \"Approve. Appends the resulting entry \\u2014 the original punch\
    \ is never touched\",\n        \"operationId\": \"approve\",\n        \"parameters\"\
    : [\n          {\n            \"name\": \"id\",\n            \"in\": \"path\"\
    ,\n            \"required\": true,\n            \"schema\": {\n              \"\
    type\": \"string\",\n              \"format\": \"uuid\"\n            }\n     \
    \     }\n        ],\n        \"requestBody\": {\n          \"content\": {\n  \
    \          \"application/json\": {\n              \"schema\": {\n            \
    \    \"$ref\": \"#/components/schemas/CorrectionDecisionRequest\"\n          \
    \    }\n            }\n          },\n          \"required\": true\n        },\n\
    \        \"responses\": {\n          \"409\": {\n            \"description\":\
    \ \"Already decided\",\n            \"content\": {\n              \"*/*\": {\n\
    \                \"schema\": {\n                  \"$ref\": \"#/components/schemas/TimeCorrectionResponse\"\
    \n                }\n              }\n            }\n          },\n          \"\
    200\": {\n            \"description\": \"Approved and applied\",\n           \
    \ \"content\": {\n              \"*/*\": {\n                \"schema\": {\n  \
    \                \"$ref\": \"#/components/schemas/TimeCorrectionResponse\"\n \
    \               }\n              }\n            }\n          },\n          \"\
    404\": {\n            \"description\": \"Not found in this tenant\",\n       \
    \     \"content\": {\n              \"*/*\": {\n                \"schema\": {\n\
    \                  \"$ref\": \"#/components/schemas/TimeCorrectionResponse\"\n\
    \                }\n              }\n            }\n          }\n        },\n\
    \        \"security\": [\n          {\n            \"bearerAuth\": []\n      \
    \    }\n        ]\n      }\n    },\n    \"/api/v1/work-days\": {\n      \"get\"\
    : {\n        \"tags\": [\n          \"Work days\"\n        ],\n        \"summary\"\
    : \"Days of an employee over a range, or of everyone for a day\",\n        \"\
    operationId\": \"list_2\",\n        \"parameters\": [\n          {\n         \
    \   \"name\": \"employeeId\",\n            \"in\": \"query\",\n            \"\
    required\": false,\n            \"schema\": {\n              \"type\": \"string\"\
    ,\n              \"format\": \"uuid\"\n            }\n          },\n         \
    \ {\n            \"name\": \"date\",\n            \"in\": \"query\",\n       \
    \     \"required\": false,\n            \"schema\": {\n              \"type\"\
    : \"string\",\n              \"format\": \"date\"\n            }\n          },\n\
    \          {\n            \"name\": \"from\",\n            \"in\": \"query\",\n\
    \            \"required\": false,\n            \"schema\": {\n              \"\
    type\": \"string\",\n              \"format\": \"date\"\n            }\n     \
    \     },\n          {\n            \"name\": \"to\",\n            \"in\": \"query\"\
    ,\n            \"required\": false,\n            \"schema\": {\n             \
    \ \"type\": \"string\",\n              \"format\": \"date\"\n            }\n \
    \         }\n        ],\n        \"responses\": {\n          \"200\": {\n    \
    \        \"description\": \"OK\",\n            \"content\": {\n              \"\
    */*\": {\n                \"schema\": {\n                  \"type\": \"array\"\
    ,\n                  \"items\": {\n                    \"$ref\": \"#/components/schemas/WorkDayResponse\"\
    \n                  }\n                }\n              }\n            }\n   \
    \       }\n        },\n        \"security\": [\n          {\n            \"bearerAuth\"\
    : []\n          }\n        ]\n      }\n    },\n    \"/api/v1/work-days/{employeeId}\"\
    : {\n      \"get\": {\n        \"tags\": [\n          \"Work days\"\n        ],\n\
    \        \"summary\": \"One employee's day. Returns zeros when nothing was recorded\"\
    ,\n        \"operationId\": \"get_1\",\n        \"parameters\": [\n          {\n\
    \            \"name\": \"employeeId\",\n            \"in\": \"path\",\n      \
    \      \"required\": true,\n            \"schema\": {\n              \"type\"\
    : \"string\",\n              \"format\": \"uuid\"\n            }\n          },\n\
    \          {\n            \"name\": \"date\",\n            \"in\": \"query\",\n\
    \            \"required\": false,\n            \"schema\": {\n              \"\
    type\": \"string\",\n              \"format\": \"date\"\n            }\n     \
    \     }\n        ],\n        \"responses\": {\n          \"200\": {\n        \
    \    \"description\": \"OK\",\n            \"content\": {\n              \"*/*\"\
    : {\n                \"schema\": {\n                  \"$ref\": \"#/components/schemas/WorkDayResponse\"\
    \n                }\n              }\n            }\n          }\n        },\n\
    \        \"security\": [\n          {\n            \"bearerAuth\": []\n      \
    \    }\n        ]\n      }\n    },\n    \"/api/v1/work-days/open\": {\n      \"\
    get\": {\n        \"tags\": [\n          \"Work days\"\n        ],\n        \"\
    summary\": \"Everyone currently clocked in\",\n        \"operationId\": \"open\"\
    ,\n        \"responses\": {\n          \"200\": {\n            \"description\"\
    : \"OK\",\n            \"content\": {\n              \"*/*\": {\n            \
    \    \"schema\": {\n                  \"type\": \"array\",\n                 \
    \ \"items\": {\n                    \"$ref\": \"#/components/schemas/WorkDayResponse\"\
    \n                  }\n                }\n              }\n            }\n   \
    \       }\n        },\n        \"security\": [\n          {\n            \"bearerAuth\"\
    : []\n          }\n        ]\n      }\n    },\n    \"/api/v1/time-entries/{id}\"\
    : {\n      \"get\": {\n        \"tags\": [\n          \"Time entries\"\n     \
    \   ],\n        \"summary\": \"Get an entry\",\n        \"operationId\": \"get_2\"\
    ,\n        \"parameters\": [\n          {\n            \"name\": \"id\",\n   \
    \         \"in\": \"path\",\n            \"required\": true,\n            \"schema\"\
    : {\n              \"type\": \"string\",\n              \"format\": \"uuid\"\n\
    \            }\n          }\n        ],\n        \"responses\": {\n          \"\
    404\": {\n            \"description\": \"Not found in this tenant\",\n       \
    \     \"content\": {\n              \"*/*\": {\n                \"schema\": {\n\
    \                  \"$ref\": \"#/components/schemas/TimeEntryResponse\"\n    \
    \            }\n              }\n            }\n          },\n          \"200\"\
    : {\n            \"description\": \"Found\",\n            \"content\": {\n   \
    \           \"*/*\": {\n                \"schema\": {\n                  \"$ref\"\
    : \"#/components/schemas/TimeEntryResponse\"\n                }\n            \
    \  }\n            }\n          }\n        },\n        \"security\": [\n      \
    \    {\n            \"bearerAuth\": []\n          }\n        ]\n      }\n    }\n\
    \  },\n  \"components\": {\n    \"schemas\": {\n      \"TimeCorrectionRequest\"\
    : {\n        \"required\": [\n          \"employeeId\",\n          \"kind\",\n\
    \          \"reason\",\n          \"workDate\"\n        ],\n        \"type\":\
    \ \"object\",\n        \"properties\": {\n          \"employeeId\": {\n      \
    \      \"type\": \"string\",\n            \"format\": \"uuid\"\n          },\n\
    \          \"kind\": {\n            \"type\": \"string\",\n            \"enum\"\
    : [\n              \"MISSING\",\n              \"AMEND\",\n              \"REMOVE\"\
    \n            ]\n          },\n          \"workDate\": {\n            \"type\"\
    : \"string\",\n            \"format\": \"date\"\n          },\n          \"targetEntryId\"\
    : {\n            \"type\": \"string\",\n            \"format\": \"uuid\"\n   \
    \       },\n          \"proposedKind\": {\n            \"type\": \"string\",\n\
    \            \"enum\": [\n              \"IN\",\n              \"OUT\",\n    \
    \          \"BREAK_START\",\n              \"BREAK_END\"\n            ]\n    \
    \      },\n          \"proposedAt\": {\n            \"type\": \"string\",\n  \
    \          \"format\": \"date-time\"\n          },\n          \"reason\": {\n\
    \            \"maxLength\": 500,\n            \"minLength\": 0,\n            \"\
    type\": \"string\"\n          }\n        }\n      },\n      \"TimeCorrectionResponse\"\
    : {\n        \"type\": \"object\",\n        \"properties\": {\n          \"id\"\
    : {\n            \"type\": \"string\",\n            \"format\": \"uuid\"\n   \
    \       },\n          \"employeeId\": {\n            \"type\": \"string\",\n \
    \           \"format\": \"uuid\"\n          },\n          \"kind\": {\n      \
    \      \"type\": \"string\",\n            \"enum\": [\n              \"MISSING\"\
    ,\n              \"AMEND\",\n              \"REMOVE\"\n            ]\n       \
    \   },\n          \"workDate\": {\n            \"type\": \"string\",\n       \
    \     \"format\": \"date\"\n          },\n          \"targetEntryId\": {\n   \
    \         \"type\": \"string\",\n            \"format\": \"uuid\"\n          },\n\
    \          \"proposedKind\": {\n            \"type\": \"string\",\n          \
    \  \"enum\": [\n              \"IN\",\n              \"OUT\",\n              \"\
    BREAK_START\",\n              \"BREAK_END\"\n            ]\n          },\n   \
    \       \"proposedAt\": {\n            \"type\": \"string\",\n            \"format\"\
    : \"date-time\"\n          },\n          \"reason\": {\n            \"type\":\
    \ \"string\"\n          },\n          \"status\": {\n            \"type\": \"\
    string\",\n            \"enum\": [\n              \"PENDING\",\n             \
    \ \"APPROVED\",\n              \"REJECTED\",\n              \"CANCELLED\"\n  \
    \          ]\n          },\n          \"approverId\": {\n            \"type\"\
    : \"string\",\n            \"format\": \"uuid\"\n          },\n          \"decidedAt\"\
    : {\n            \"type\": \"string\",\n            \"format\": \"date-time\"\n\
    \          },\n          \"decisionNote\": {\n            \"type\": \"string\"\
    \n          },\n          \"resultingEntryId\": {\n            \"type\": \"string\"\
    ,\n            \"format\": \"uuid\"\n          },\n          \"requestedAt\":\
    \ {\n            \"type\": \"string\",\n            \"format\": \"date-time\"\n\
    \          },\n          \"createdAt\": {\n            \"type\": \"string\",\n\
    \            \"format\": \"date-time\"\n          },\n          \"updatedAt\"\
    : {\n            \"type\": \"string\",\n            \"format\": \"date-time\"\n\
    \          }\n        }\n      },\n      \"WorkDayComputeRequest\": {\n      \
    \  \"type\": \"object\",\n        \"properties\": {\n          \"expectedMinutes\"\
    : {\n            \"minimum\": 0,\n            \"type\": \"integer\",\n       \
    \     \"format\": \"int32\"\n          }\n        }\n      },\n      \"TimeEntryResponse\"\
    : {\n        \"type\": \"object\",\n        \"properties\": {\n          \"id\"\
