apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: realm-import-acme
  namespace: rrhh-auth
spec:
  keycloakCRName: keycloak
  realm:
    realm: rrhh-tenant-acme
    enabled: true
    displayName: "RRHH - Acme Corporation"
    sslRequired: external
    registrationAllowed: false
    loginWithEmailAllowed: true
    registrationEmailAsUsername: true
    duplicateEmailsAllowed: false
    resetPasswordAllowed: true
    editUsernameAllowed: false
    # Fuerza bruta: el 10º fallo bloquea 15 min; los intentos durante el bloqueo
    # no lo alargan. Después, cada fallo vuelve a bloquear 15 min hasta un acierto
    # o 12 h sin fallos. Sin bloqueo permanente. Se desbloquea con
    # DELETE /admin/realms/{realm}/attack-detection/brute-force/users/{id}.
    bruteForceProtected: true
    failureFactor: 10
    waitIncrementSeconds: 900
    maxFailureWaitSeconds: 900
    maxDeltaTimeSeconds: 43200
    permanentLockout: false

    # User profile declarativo (Keycloak 26): un atributo que no esté declarado
    # aquí no se guarda. employee_id lo asigna solo un admin; el usuario lo ve.
    components:
      org.keycloak.userprofile.UserProfileProvider:
        - providerId: declarative-user-profile
          subComponents: {}
          config:
            kc.user.profile.config:
              - '{"attributes":[{"name":"username","displayName":"${username}","validations":{"length":{"min":3,"max":255},"username-prohibited-characters":{},"up-username-not-idn-homograph":{}},"permissions":{"view":["admin","user"],"edit":["admin","user"]},"multivalued":false},{"name":"email","displayName":"${email}","validations":{"email":{},"length":{"max":255}},"required":{"roles":["user"]},"permissions":{"view":["admin","user"],"edit":["admin"]},"multivalued":false},{"name":"firstName","displayName":"${firstName}","validations":{"length":{"max":255},"person-name-prohibited-characters":{}},"required":{"roles":["user"]},"permissions":{"view":["admin","user"],"edit":["admin","user"]},"multivalued":false},{"name":"lastName","displayName":"${lastName}","validations":{"length":{"max":255},"person-name-prohibited-characters":{}},"required":{"roles":["user"]},"permissions":{"view":["admin","user"],"edit":["admin","user"]},"multivalued":false},{"name":"employee_id","displayName":"Employee ID","validations":{"pattern":{"pattern":"^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$","error-message":"employee_id debe ser un UUID"}},"permissions":{"view":["admin","user"],"edit":["admin"]},"multivalued":false}],"groups":[{"name":"user-metadata","displayHeader":"User metadata","displayDescription":"Attributes, which refer to user metadata"}]}'

    roles:
      realm:
        - name: ADMIN_RRHH
          description: "Administrador de RRHH con acceso total"
        - name: MANAGER
          description: "Manager con acceso a su departamento"
        - name: EMPLOYEE
          description: "Empleado con acceso a su propio perfil"
        - name: AUDITOR
          description: "Auditor con acceso de solo lectura"

    clients:
      - clientId: rrhh-frontend
        name: "RRHH Frontend Application"
        enabled: true
        publicClient: true
        standardFlowEnabled: true
        directAccessGrantsEnabled: true
        rootUrl: "https://app.aspavi.com"
        redirectUris:
          - "https://app.aspavi.com/*"
          - "https://acme.aspavi.com/*"
        webOrigins:
          - "https://app.aspavi.com"
          - "https://acme.aspavi.com"
        protocol: openid-connect
        attributes:
          pkce.code.challenge.method: "S256"
        protocolMappers:
          - name: tenant_id
            protocol: openid-connect
            protocolMapper: oidc-hardcoded-claim-mapper
            config:
              claim.name: tenant_id
              claim.value: acme
              jsonType.label: String
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"
          - name: realm-roles
            protocol: openid-connect
            protocolMapper: oidc-usermodel-realm-role-mapper
            config:
              claim.name: roles
              jsonType.label: String
              multivalued: "true"
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"
          - name: employee_id
            protocol: openid-connect
            protocolMapper: oidc-usermodel-attribute-mapper
            config:
              user.attribute: employee_id
              claim.name: employee_id
              jsonType.label: String
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"

      - clientId: rrhh-employee-service
        name: "Employee Service"
        enabled: true
        publicClient: false
        standardFlowEnabled: false
        serviceAccountsEnabled: true
        clientAuthenticatorType: client-secret
        protocol: openid-connect
        protocolMappers:
          - name: tenant_id
            protocol: openid-connect
            protocolMapper: oidc-hardcoded-claim-mapper
            config:
              claim.name: tenant_id
              claim.value: acme
              jsonType.label: String
              id.token.claim: "true"
              access.token.claim: "true"

      - clientId: rrhh-iam-service
        name: "IAM Service"
        enabled: true
        publicClient: false
        standardFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: true
        clientAuthenticatorType: client-secret
        protocol: openid-connect
        protocolMappers:
          - name: tenant_id
            protocol: openid-connect
            protocolMapper: oidc-hardcoded-claim-mapper
            config:
              claim.name: tenant_id
              claim.value: acme
              jsonType.label: String
              id.token.claim: "true"
              access.token.claim: "true"

    # Service account de rrhh-iam-service: gestiona roles y asignaciones del
    # realm. Solo estos cinco roles; nada de realm-admin.
    users:
      - username: service-account-rrhh-iam-service
        enabled: true
        serviceAccountClientId: rrhh-iam-service
        clientRoles:
          realm-management:
            - view-realm
            - manage-realm
            - view-users
            - query-users
            - manage-users
