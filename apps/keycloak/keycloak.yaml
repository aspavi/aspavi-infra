apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: rrhh-auth
spec:
  instances: 1
  db:
    vendor: postgres
    host: postgresql.rrhh-data
    port: 5432
    database: keycloak
    usernameSecret:
      name: keycloak-db-secret
      key: username
    passwordSecret:
      name: keycloak-db-secret
      key: password
  http:
    httpEnabled: true
  # Hostname v2. Con una URL completa, el emisor (iss) es siempre
  # https://keycloak.aspavi.com/realms/<realm>, se entre por el ingress o por la
  # red interna (keycloak-service.rrhh-auth:8080, la que usa iam). Con solo el
  # host, el iss salía del request (http://keycloak.aspavi.com:8080/...) y un
  # token emitido por una URL no valía por la otra. backchannelDynamic: el
  # well-known pedido por la red interna anuncia endpoints internos.
  hostname:
    hostname: https://keycloak.aspavi.com
    backchannelDynamic: true
    # La administración no se publica (ASP-5): la consola se abre por
    # port-forward en http://localhost:18080/admin/ (ver scripts/keycloak/README.md).
    # El realm master lleva además el atributo frontendUrl=http://localhost:18080
    # para que su login no salga al hostname público.
    admin: http://localhost:18080
  # Sin el ingress del operador: publicaba todo Keycloak por http (puerto 80) y
  # con defaultBackend, para cualquier host. El único ingress es apps/keycloak/ingress.yaml.
  ingress:
    enabled: false
  proxy:
    headers: xforwarded
  additionalOptions:
    - name: log-level
      value: INFO
    - name: features
      value: "token-exchange,admin-fine-grained-authz"
