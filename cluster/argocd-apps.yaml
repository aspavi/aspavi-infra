apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vmorera/aspavi-infra.git
    targetRevision: master
    path: argocd/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      # prune se omite a proposito. Es false por defecto, y este objeto no
      # llega a guardar el campo: algo lo descarta al reconciliarlo, asi que
      # declararlo dejaba a cluster-config OutOfSync para siempre pidiendo una
      # diferencia que no existe. Comportamiento identico, sin el ruido.
      selfHeal: true
