apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rrhh-frontend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vmorera/aspavi-infra.git
    targetRevision: master
    path: apps/rrhh-frontend
  destination:
    server: https://kubernetes.default.svc
    namespace: rrhh-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
