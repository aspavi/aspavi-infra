apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-docs
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vmorera/aspavi-infra.git
    targetRevision: master
    path: apps/api-docs
  destination:
    server: https://kubernetes.default.svc
    namespace: rrhh-docs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
