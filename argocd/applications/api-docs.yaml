apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-docs
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vmorera/aspavi-infra.git
    targetRevision: master
    path: apps/api-docs
  destination:
    server: https://kubernetes.default.svc
    namespace: rrhh-docs
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    # The bundled OpenAPI specs outgrew the 256 KiB cap on metadata.annotations,
    # which a client-side apply hits because it stores the whole object in
    # last-applied-configuration. Server-side apply never writes that annotation.
    syncOptions:
      - ServerSideApply=true
