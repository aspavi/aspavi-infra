# helm/postgresql/values.yaml
# Valores COMUNES a todos los entornos
# Los passwords se gestionan via Secret "postgresql-helm-secrets" (ver cluster/postgresql-secret.yaml)
# Los overrides por entorno están en environments/{env}/postgresql/values.yaml

auth:
  username: app_user
  database: postgres
  existingSecret: postgresql-helm-secrets
  secretKeys:
    adminPasswordKey: postgres-password
    userPasswordKey: app-password

primary:
  persistence:
    enabled: true
  initdb:
    scriptsSecret: postgresql-init-secret
    scripts:
      01_create_service_databases.sql: |
        -- Create one database per microservice and transfer ownership to app_user.
        -- Ownership gives app_user full CREATE/DDL rights in the public schema,
        -- so Flyway can run migrations without any manual GRANT steps.
        -- To add a new service: create the database here and redeploy PostgreSQL.
        -- Allow app_user to create new databases (needed by the
        -- per-service db-bootstrap Jobs that run in rrhh-system,
        -- where only the app_user's password is available).
        ALTER USER app_user CREATEDB;

        CREATE DATABASE employee_db;
        ALTER DATABASE employee_db OWNER TO app_user;

        CREATE DATABASE audit_db;
        ALTER DATABASE audit_db OWNER TO app_user;

        CREATE DATABASE organization_db;
        ALTER DATABASE organization_db OWNER TO app_user;

        CREATE DATABASE payroll_db;
        ALTER DATABASE payroll_db OWNER TO app_user;

        CREATE DATABASE collective_agreements_db;
        ALTER DATABASE collective_agreements_db OWNER TO app_user;

        CREATE DATABASE contract_db;
        ALTER DATABASE contract_db OWNER TO app_user;

readReplicas:
  replicaCount: 0

backup:
  enabled: false

metrics:
  enabled: false
