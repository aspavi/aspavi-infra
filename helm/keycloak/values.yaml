# helm/keycloak/values.yaml
# Valores comunes a todos los entornos
# Chart: codecentric/keycloakx 7.1.3 (usa imagen oficial quay.io/keycloak/keycloak)
# Secretos gestionados via Secret manual "keycloak-secrets" en namespace rrhh-auth

image:
  repository: quay.io/keycloak/keycloak
  tag: "26.3.3"

# Proxy: Traefik gestiona TLS externamente, Keycloak recibe tráfico HTTP
proxy:
  enabled: true
  mode: forwarded
  http:
    enabled: true

# Database: usa el helper nativo del chart (evita duplicar KC_DB_* en extraEnv)
database:
  vendor: postgres
  hostname: postgresql.rrhh-data
  port: 5432
  database: keycloak
  username: keycloak_user
  existingSecret: keycloak-secrets
  existingSecretKey: db-password

# Cache: "custom" desactiva la inyección automática de KC_CACHE/KC_CACHE_STACK
# Cada entorno define su propio cache.stack (local para dev, ispn para prod)
cache:
  stack: custom

# Hostname y admin credentials via extraEnv (no tienen helpers nativos en el chart)
extraEnv: |
  - name: KC_HOSTNAME
    value: keycloak.aspavi.com
  - name: KC_HOSTNAME_STRICT
    value: "false"
  - name: KC_BOOTSTRAP_ADMIN_USERNAME
    value: admin
  - name: KC_BOOTSTRAP_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-secrets
        key: admin-password

# Health y métricas habilitadas (puerto 9000 de management)
health:
  enabled: true

metrics:
  enabled: true

# Keycloak 26 sirve en / por defecto; el chart hereda /auth de versiones antiguas
http:
  relativePath: "/"

# Ingress gestionado por Traefik con TLS via cert-manager
ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  rules:
    - host: keycloak.aspavi.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - keycloak.aspavi.com
      secretName: keycloak-tls
